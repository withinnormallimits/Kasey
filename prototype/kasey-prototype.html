  title:"How to actually use AI with an autistic child",
  dek:"The honest version: it's a tool for you, and only sometimes for them.",
  read:"7 min",
  updated:"July 2026",
  body:`
<p class="a-p">Every app, clinic and parenting group is telling you AI will change everything for your child. Most of that is being said by people selling something. Here is what the evidence actually supports, what to avoid entirely, and where the line sits by age.</p>

<p class="a-p">The single most useful reframe: <strong>for most families, the person who should be using AI is the parent, not the child.</strong> You are the one drowning in paperwork, appointment notes, insurance letters and school emails. That is where the hours come back.</p>

<h2 class="a-h">What it's genuinely good at — for you</h2>

<p class="a-p">These are the uses with the least risk and the highest payoff, because you stay in the loop and nothing lands on your child unfiltered.</p>

<ul class="a-ul">
  <li><strong>Translating the paperwork.</strong> Paste an evaluation report or IEP draft and ask what each section means in plain English, and what it commits the school to. You'll spot vague language you'd otherwise sign.</li>
  <li><strong>Drafting the hard email.</strong> "Write a polite but firm request for an independent evaluation" gets you a first draft in seconds. You edit; you send.</li>
  <li><strong>Preparing for the meeting.</strong> Ask it to play the school's side and push back on your requests, so you hear the objections before the room does.</li>
  <li><strong>Writing social stories.</strong> A short, first-person script for a haircut, a dentist visit, a new sitter — generated in your child's vocabulary, then edited by you.</li>
  <li><strong>Making sense of your own log.</strong> Paste an exported log and ask what's most frequent. Ask for counts, never for causes.</li>
</ul>

<div class="a-call">
  <span class="lab">The prompt that works best</span>
  <p>Give it the role, the audience and the constraint: "You're helping a parent prepare for an IEP meeting. My son is 7, autistic, struggles with transitions. Write five questions I should ask about how transitions will be handled. Keep them short and specific."</p>
</div>

<h2 class="a-h">Where the line is, by age</h2>

<p class="a-p">Common Sense Media published age guidance in June 2026 after testing chatbots directly with kids. Their bands are a sensible floor, and they apply to autistic children too — with one adjustment noted below.</p>

<div class="a-age">
  <span class="band">UNDER 5</span>
  <h4>No chatbots</h4>
  <p>Children this age can't reliably tell AI from a person. The moments you'd be tempted to outsource — reading aloud, storytelling — are the ones doing the most developmental work.</p>
</div>

<div class="a-age">
  <span class="band">AGES 6–12</span>
  <h4>Only with you sitting there</h4>
  <p>Chatbots make mistakes, agree too readily, and can surface content you didn't want. Shared use is fine; solo use isn't. Treat it like a kitchen knife, not a toy.</p>
</div>

<div class="a-age">
  <span class="band">AGES 13–17</span>
  <h4>Homework and creativity, supervised</h4>
  <p>The useful test is one question: is this helping them learn, or helping them finish? Ask them to explain the answer back to you in their own words.</p>
</div>

<div class="a-age">
  <span class="band">ANY AGE UNDER 18</span>
  <h4>Never for comfort, friendship, or mental health</h4>
  <p>This is the rule with the least wiggle room, and the one most worth holding.</p>
</div>

<h2 class="a-h">Why the companionship rule matters more for our kids</h2>

<p class="a-p">A 2025 Common Sense study found 72% of teens had used an AI companion at least once, and about a third said those conversations were as satisfying as talking to real people. The organisation concluded companion bots pose an unacceptable risk to under-18s. In early 2026, Character.AI and Google settled multiple wrongful-death suits brought by families of teenagers.</p>

<p class="a-p">Now add the part that's specific to us. A child who finds human interaction effortful and unpredictable is being offered something that never gets tired, never misreads them, and never asks for anything back. That is not a neutral trade. It is precisely the child for whom a frictionless substitute is most appealing and most costly.</p>

<blockquote class="a-quote">A bot that always agrees is the worst possible mirror for a kid who is already struggling to read other people.</blockquote>

<p class="a-p">Testing has repeatedly found chatbots miss signs of depression, anxiety and self-harm unless a child states them in plain words — and then soften their warnings when pushed. Autistic kids often don't state things in plain words. That gap is where the danger sits.</p>

<h2 class="a-h">The one exception worth knowing</h2>

<p class="a-p">Communication tools are a different category from chatbots. AAC apps — the picture-and-symbol systems that let a minimally speaking child build sentences — are established practice, prescribed by speech-language pathologists, and increasingly use AI for word prediction. That is not a companion. It is a voice.</p>

<p class="a-p">If your child is minimally speaking, the conversation to have is with an SLP about AAC, not with a chatbot company about engagement.</p>

<hr class="a-rule">

<h2 class="a-h">Four failure modes to watch for in yourself</h2>

<p class="a-sh">1 · It will agree with you</p>
<p class="a-p">Chatbots are built to be agreeable. Bring it a theory about your child — "I think dairy is causing the meltdowns" — and it will help you build the case. Ask for the argument against your theory, every time.</p>

<p class="a-sh">2 · It will invent things confidently</p>
<p class="a-p">Especially citations, statutes, and deadlines. Anything legal or medical gets verified against the actual source before you act on it.</p>

<p class="a-sh">3 · It doesn't know your child</p>
<p class="a-p">It knows autism in general, which is a category so broad as to be nearly useless at the individual level. Your log knows your child. The AI only knows what you paste into it.</p>

<p class="a-sh">4 · It is not private by default</p>
<p class="a-p">Consumer chatbots are not covered by medical privacy law. Don't paste full names, dates of birth, addresses or medical record numbers. Strip identifiers first — "my 7-year-old son" is enough context for any useful answer.</p>

<div class="a-call warn">
  <span class="lab">Never</span>
  <p>Never use a chatbot for diagnosis, medication questions, crisis situations, or as a stand-in for therapy. If your child is in danger, you need a human being with a licence and a phone number, not a text box.</p>
</div>

<h2 class="a-h">Where to start this week</h2>

<ul class="a-ul">
  <li>Take the most confusing document in your file and ask for a plain-English summary plus three questions you should be asking.</li>
  <li>Write one social story for the thing coming up that you're dreading.</li>
  <li>If you have a teenager, ask them what they use and don't react to the answer — nearly half of parents don't know.</li>
</ul>

<div class="a-src">
  <h5>Sources</h5>
  <ul>
    <li>Common Sense Media — AI Chatbots and Your Child: Age and Stage Guidance, June 2026</li>
    <li>Common Sense Media — Talk, Trust, and Trade-Offs: How and Why Teens Use AI Companions, 2025</li>
    <li>Child Mind Institute — AI Chatbots and Teens, reviewed March 2026</li>
    <li>American Psychological Association — guidance for parents on teens and chatbots, February 2026</li>
    <li>Stanford SCALE Initiative — review of 800+ studies on AI in K–12 education</li>
  </ul>
  <p class="a-disc">General information for parents, not medical or clinical advice. Talk to your child's care team about anything specific to them.</p>
</div>

  id:"school",
  eyebrow:"Choosing a school",
  cover:"linear-gradient(135deg,#7A4E2E 0%,#C08A4E 100%)",

  title:"Public, charter, or private — what actually changes",
  dek:"One legal fact decides more than every tour you'll take. Most parents hear it too late.",
  read:"9 min",
  updated:"July 2026",
  body:`
<p class="a-p">School choice for an autistic child gets argued about as though it's a values question. It isn't, or at least not first. It's a question about which supports are legally guaranteed, which are discretionary, and which disappear the moment you sign an enrolment form.</p>

<p class="a-p">Start with the fact that reorders everything else.</p>

<div class="a-call">
  <span class="lab">The fact that decides most of it</span>
  <p>Your child's right to services under federal special education law attaches to <strong>public</strong> enrolment. Enrol them privately by choice and that individual right does not travel with them. Charter schools are public schools, so the right stays. Private schools are not, so it doesn't.</p>
</div>

<h2 class="a-h">Public district school</h2>

<p class="a-p">Under IDEA — the federal special education law — an eligible child is entitled to a free appropriate public education, delivered through an IEP written by a team that includes you, in the least restrictive environment appropriate for them.</p>

<p class="a-p">What that buys you in practice:</p>

<ul class="a-ul">
  <li><strong>A binding document.</strong> The IEP isn't a wish list. Services in it must be delivered.</li>
  <li><strong>A seat at the table.</strong> You are a required member of the team, and you can call a meeting.</li>
  <li><strong>Real recourse.</strong> Mediation, state complaints, and due process hearings exist when the school doesn't deliver.</li>
  <li><strong>Child Find.</strong> The district has an affirmative duty to identify and evaluate children it suspects have a disability. You don't have to prove anything first.</li>
  <li><strong>Free evaluations,</strong> and the right to request an independent one at public expense if you disagree with theirs.</li>
</ul>

<p class="a-p">The trade is that quality varies enormously by district and even by building, and "appropriate" is a legal standard, not a synonym for excellent. A large district may have a full continuum of placements. A small one may have exactly one classroom and a long wait.</p>

<h2 class="a-h">Charter school</h2>

<p class="a-p">The most common misconception in this whole conversation: a charter school is a public school. The US Department of Education has been explicit that children with disabilities attending public charters, and their parents, keep every right and protection under IDEA that they'd have in any other public school. Child Find applies. FAPE applies. Section 504 and the ADA apply. None of it is waived by enrolling.</p>

<p class="a-p">A charter also cannot decline to serve your child because the service isn't in its current programme. If it's an independent district in its own right, it has to build the service, contract it out, or otherwise ensure it happens — at no cost to you.</p>

<p class="a-sh">The question to ask on the tour</p>
<p class="a-p">"Are you your own school district, or are you part of the local one?" This single answer tells you who is legally on the hook, who writes the IEP, and who you escalate to. Charters are structured both ways depending on the state, and staff should be able to answer it instantly. Hesitation is information.</p>

<div class="a-call warn">
  <span class="lab">Watch for</span>
  <p>Some charters are excellent at inclusion. Others quietly counsel families out — long waitlists that never move, repeated suggestions that "he might be happier somewhere with more support." That's a soft version of something that isn't legal. Ask directly how many students on IEPs they currently serve, and what their most intensive support looks like.</p>
</div>

<h2 class="a-h">Private school</h2>

<p class="a-p">Here's where it changes, and where families are most often surprised.</p>

<p class="a-p">When you enrol your child privately by your own choice — "parentally placed," in the statute — your child no longer has an individual right to special education services. The local district still has to find and evaluate children in private schools in its boundaries, and it must spend a proportionate share of its federal funds on that population as a group. But the district decides how to spend it, and the decision about who gets what is theirs, not yours.</p>

<p class="a-p">If your child is chosen to receive services, the document is a <strong>services plan</strong>, not an IEP. It is generally narrower, it covers only what the district has offered, and it carries none of the enforceable individual entitlement an IEP does.</p>

<p class="a-p">Two protections do survive: Section 504 and the ADA still prohibit disability discrimination, so you can request reasonable accommodations. Most private schools are covered — religious schools are a partial exception under the ADA, so check.</p>

<p class="a-sh">The important asterisk</p>
<p class="a-p">If a public district places your child in a private school because it can't provide an appropriate programme itself, that's a completely different situation. The district funds it and the full IDEA rights come with them. That's a placement, not a choice.</p>

<blockquote class="a-quote">A private school with a great reputation and no special education staff may serve your child worse than an average public school with a strong team.</blockquote>

<h2 class="a-h">Why private schools can't be compared as a group</h2>

<p class="a-p">"Private school" describes a funding model, not an educational one. In practice the range runs from schools built specifically for autistic and learning-disabled students, with clinicians on staff, through to selective academic schools with no support staffing at all and an unstated expectation that students arrive needing nothing.</p>

<p class="a-p">Both of those are private schools. They will serve your child in opposite ways. Reputation, tuition and admissions selectivity tell you almost nothing about which one you're looking at.</p>

<h2 class="a-h">If a state scholarship or voucher is on the table</h2>

<p class="a-p">Many states now offer scholarships or education savings accounts for students with disabilities. They can be genuinely useful — and in several states, accepting one requires signing a form acknowledging that you're giving up your child's entitlement to services from the public system while they use it.</p>

<p class="a-p">That may still be the right call. But read the acknowledgment yourself, in full, before signing. It is usually one paragraph and it is usually the most consequential paragraph in the packet.</p>

<hr class="a-rule">

<h2 class="a-h">What to actually ask on a tour</h2>

<p class="a-p">Skip the mission statement. These questions produce answers you can compare across every school on your list.</p>

<ul class="a-ul">
  <li><strong>"Who provides speech and OT here, on what schedule, and where does it happen?"</strong> Pull-out, push-in, and contracted-once-a-month are wildly different answers.</li>
  <li><strong>"What is your plan when a student is dysregulated?"</strong> Listen for whether it's a place and a person, or a call home. Ask directly about restraint and seclusion policy.</li>
  <li><strong>"How many students here have an IEP or a services plan?"</strong> A school that doesn't know isn't tracking it.</li>
  <li><strong>"What does the day look like for a student who needs a break every hour?"</strong> Ask them to walk you through it minute by minute.</li>
  <li><strong>"Who is my child's person?"</strong> Every child who struggles needs one adult in the building who knows them. If nobody can name that role, it doesn't exist.</li>
  <li><strong>"Can I see the space where the support happens?"</strong> A converted storage closet tells you everything the brochure won't.</li>
  <li><strong>"How do you handle a student who has never had a friend?"</strong> Watch whether they've thought about it at all.</li>
</ul>

<h2 class="a-h">Decide against your child, not against the debate</h2>

<p class="a-p">School choice is a loud political argument right now, and it's easy to absorb a position by osmosis from people whose children are nothing like yours. None of that has any bearing on which building your child should walk into in August.</p>

<p class="a-p">Three questions actually settle it:</p>

<ul class="a-ul">
  <li><strong>What does my child need that is non-negotiable?</strong> Write it down before any tour. Sensory space. A predictable schedule. Speech three times a week.</li>
  <li><strong>Which of those is legally guaranteed here, and which depends on goodwill?</strong> Goodwill is real, and it leaves when the principal does.</li>
  <li><strong>What's my recourse if it stops working in March?</strong> In a public setting you have a process. In a private one you have a conversation.</li>
</ul>

<p class="a-p">Your log helps here more than you'd expect. Walking into a tour able to say "he averages about twenty minutes to recover and the thing that works is a quiet space with headphones" turns an abstract conversation into a concrete one. You'll learn more from how they respond to that sentence than from the rest of the visit.</p>

<div class="a-src">
  <h5>Sources</h5>
  <ul>
    <li>US Dept of Education, OSEP — Questions and Answers on Serving Children with Disabilities Placed by Their Parents in Private Schools, rev. Feb 2022</li>
    <li>US Dept of Education, OSERS — FAQ on the Rights of Students with Disabilities in Public Charter Schools under IDEA</li>
    <li>34 C.F.R. §§ 300.130–300.144 (equitable services); § 300.137 (no individual right); § 300.209 (charter schools)</li>
    <li>ASHA — IDEA Part B issue brief on parentally placed private school children</li>
    <li>Understood.org — The difference between IEPs and service plans</li>
  </ul>
  <p class="a-disc">General information, not legal advice. Special education law varies by state and situation — a parent advocate or education attorney is worth the consultation before you sign anything.</p>
</div>

function renderDoctor(a){
  var s = DATA.settings;
  var warn = lowNBanner(a.episodes); if(warn) view.appendChild(warn);

  var prior  = analyse(entriesBetween(Date.now() - 60*86400000, Date.now() - 30*86400000));
  var recent = analyse(entriesBetween(Date.now() - 30*86400000, Date.now() + 1));

  var paper = el("div","paper");
  var mast = el("div","p-masthead");
  mast.appendChild(mark("kcPlain"));
  mast.appendChild(el("span","nm","Kasey"));
  mast.appendChild(el("span","rule"));
  paper.appendChild(mast);
  var head = el("div","p-head");
  head.appendChild(el("h2", null, childName() + (s.childAge ? ", age " + s.childAge : "")));
  head.appendChild(el("div","who","Caregiver-reported episode summary"));
  var gen = el("div","gen");
  gen.appendChild(el("div", null, "Prepared " + fmtStamp(new Date().toISOString())));
  gen.appendChild(el("div", null, "Observation period: " + a.spanDays + " days · " +
    a.allDays + " logged · " + a.episodes + " episodes"));
  if(s.contact) gen.appendChild(el("div", null, "Reported by " + s.contact));
  head.appendChild(gen);
  paper.appendChild(head);

  function trow(tbl, label, val){
    var tr = document.createElement("tr");
    var td1 = document.createElement("td"); td1.textContent = label;
    var td2 = document.createElement("td"); td2.textContent = val;
    tr.appendChild(td1); tr.appendChild(td2); tbl.appendChild(tr);
  }

  var b0 = el("div","p-block");
  b0.appendChild(el("h3", null, "At a glance"));
  var t0 = el("table","p-tbl");
  trow(t0, "Days logged", String(a.allDays));
  trow(t0, "Days with at least one episode", a.hardDays + " of " + a.allDays);
  trow(t0, "Days marked good by caregiver", String(a.goodDays));
  trow(t0, "Episodes recorded", String(a.episodes) +
    (a.episodes > a.hardDays ? " (some days had more than one)" : ""));
  trow(t0, "Episode frequency", (a.perWeek ? a.perWeek.toFixed(1) : "0") + " per week");
  trow(t0, "Median time to baseline", fmtMins(a.typical));
  trow(t0, "De-escalated at stage 1", a.caughtEarly + " of " + a.episodes);
  trow(t0, "Longest episode", a.longest[0] ? fmtMins(a.longest[0].minutes) : "—");
  trow(t0, "Nothing tried helped", a.nothing + " of " + a.n);
  if(prior.n && recent.n){
    var dm = pctChange(prior.typical, recent.typical);
    var df = pctChange(prior.n, recent.n);
    trow(t0, "Last 30 vs prior 30",
      (df === null ? "—" : (df > 0 ? "+" : "") + df + "% frequency") + " · " +
      (dm === null ? "—" : (dm > 0 ? "+" : "") + dm + "% duration"));
  }
  b0.appendChild(t0);
  paper.appendChild(b0);

  var bS = el("div","p-block");
  bS.appendChild(el("h3", null, "Escalation reached"));
  var tS = el("table","p-tbl");
  STAGES.forEach(function(st){
    var c = a.stages[st.n] || 0;
    trow(tS, st.n + " · " + st.name, c + (a.n ? " (" + Math.round(c/a.n*100) + "%)" : ""));
  });
  bS.appendChild(tS);
  paper.appendChild(bS);

  if(a.topTriggers.length){
    var b1 = el("div","p-block");
    b1.appendChild(el("h3", null, "Recorded antecedents"));
    var t1 = el("table","p-tbl");
    a.topTriggers.forEach(function(t){ trow(t1, t.name, t.n + " (" + Math.round(t.n/a.n*100) + "%)"); });
    b1.appendChild(t1);
    paper.appendChild(b1);
  }

  if(a.topBeh.length){
    var b2 = el("div","p-block");
    b2.appendChild(el("h3", null, "Observed behaviors"));
    var t2 = el("table","p-tbl");
    a.topBeh.forEach(function(t){ trow(t2, t.name, String(t.n)); });
    b2.appendChild(t2);
    paper.appendChild(b2);
  }

  var b3 = el("div","p-block");
  b3.appendChild(el("h3", null, "Interventions tried"));
  var t3 = el("table","p-tbl");
  if(!a.helps.length) trow(t3, "None recorded", "—");
  a.helps.forEach(function(t){ trow(t3, t.name, "n=" + t.n + " · median " + fmtMins(t.med)); });
  b3.appendChild(t3);
  paper.appendChild(b3);

  if(a.sources.length > 1){
    var b4 = el("div","p-block");
    b4.appendChild(el("h3", null, "By setting"));
    var t4 = el("table","p-tbl");
    a.sources.forEach(function(t){ trow(t4, t.name, String(t.n)); });
    b4.appendChild(t4);
    paper.appendChild(b4);
  }

  var meds = currentMeds(), past = pastMeds();
  if(meds.length){
    var bM = el("div","p-block");
    bM.appendChild(el("h3", null, "Current medication"));
    var tM = el("table","p-tbl");
    meds.forEach(function(c){
      trow(tM, c.label + (c.dose ? " — " + c.dose : ""),
        "since " + fmtDate(c.start) + " (" + daysSince(c.start) + "d)");
    });
    bM.appendChild(tM);
    paper.appendChild(bM);
  }
  if(past.length){
    var bP = el("div","p-block");
    bP.appendChild(el("h3", null, "Medication history"));
    var tP = el("table","p-tbl");
    past.forEach(function(c){
      trow(tP, c.label + (c.dose ? " — " + c.dose : ""),
        fmtDate(c.start) + " to " + fmtDate(c.end));
    });
    bP.appendChild(tP);
    paper.appendChild(bP);
  }
  var others = DATA.changes.filter(function(c){ return c.kind !== "med"; });
  if(others.length){
    var bO = el("div","p-block");
    bO.appendChild(el("h3", null, "Other changes"));
    var tO = el("table","p-tbl");
    others.slice().sort(function(a,b){ return new Date(a.start) - new Date(b.start); })
      .forEach(function(c){ trow(tO, c.label, kindLabel(c.kind) + " · " + fmtDate(c.start)); });
    bO.appendChild(tO);
    paper.appendChild(bO);
  }

  if(a.flagged.length){
    var b6 = el("div","p-block warn");
    b6.appendChild(el("h3", null, "Flagged to raise"));
    var t6 = el("table","p-tbl");
    a.flagged.forEach(function(e){
      var d = new Date(e.at);
      trow(t6, MONS[d.getMonth()] + " " + d.getDate() + " — " + (e.trigger || "—"),
        (e.note || fmtMins(e.minutes)).slice(0,60));
    });
    b6.appendChild(t6);
    paper.appendChild(b6);
  }

  if(a.longest.length){
    var b7 = el("div","p-block");
    b7.appendChild(el("h3", null, "Longest episodes"));
    var t7 = el("table","p-tbl");
    a.longest.forEach(function(e){
      var d = new Date(e.at);
      trow(t7, MONS[d.getMonth()] + " " + d.getDate() + " — " + (e.trigger || "—"), fmtMins(e.minutes));
    });
    b7.appendChild(t7);
    paper.appendChild(b7);
  }

  if(s.alwaysTrue || s.worthKnowing){
    var b8 = el("div","p-block");
    b8.appendChild(el("h3", null, "Caregiver notes"));
    b8.appendChild(el("p","p-prose", [s.alwaysTrue, s.worthKnowing].filter(Boolean).join("\n\n")));
    paper.appendChild(b8);
  }

  var foot = el("div","p-foot");
  foot.appendChild(el("div", null, "kaseyapp.com"));
  foot.appendChild(el("div", null, "Caregiver-reported data collected retrospectively after each episode. Counts and durations are as recorded by the parent and have not been clinically verified. Recorded antecedents are what the caregiver observed beforehand, not established causes. Days are counted as distinct calendar days: a day with several episodes counts once, and days logged without an episode are included in the denominator." +
    (a.bothDays ? " " + a.bothDays + (a.bothDays === 1 ? " day was" : " days were") + " marked good by the caregiver despite containing an episode." : "")));
  paper.appendChild(foot);
  view.appendChild(paper);
}

function renderChanges(){
  var meds = currentMeds(), past = pastMeds();

  /* --- what he's on right now --- */
  view.appendChild(el("div","daylabel","On right now"));
  if(!meds.length){
    var none = el("p","mk-thin");
    none.style.margin = "0 2px 16px";
    none.textContent = "No medication recorded. If there is one, log it as a change — it shows up on the doctor's page and on the page you hand a sitter.";
    view.appendChild(none);
  } else {
    meds.forEach(function(c){
      var card = el("div","med");
      var top = el("div","med-top");
      var nm = el("div");
      nm.appendChild(el("span","med-name", c.label));
      if(c.dose) nm.appendChild(el("span","med-dose", c.dose));
      top.appendChild(nm);
      top.appendChild(el("span","med-since", daysSince(c.start) + "d"));
      card.appendChild(top);
      card.appendChild(el("div","med-meta","Since " + fmtDate(c.start)));
      if(c.note) card.appendChild(el("div","med-meta", c.note));
      var row = el("div","med-acts");
      var chg = el("button", null, "Change dose"); chg.type = "button";
      chg.addEventListener("click", function(){ addChange({from:c}); });
      var stop = el("button", null, "Mark stopped"); stop.type = "button";
      stop.addEventListener("click", function(){
        askConfirm("Mark " + c.label + " as stopped today? It stays in the history.", "Mark stopped", function(){
          c.end = new Date().toISOString();
          save(); render(); toast("Marked stopped");
        });
      });
      row.appendChild(chg); row.appendChild(stop);
      card.appendChild(row);
      view.appendChild(card);
    });
  }

  if(past.length){
    var pastHead = el("div","daylabel","No longer taking");
    pastHead.style.marginTop = "22px";
    view.appendChild(pastHead);
    past.forEach(function(c){
      var row = el("div","med past");
      row.appendChild(el("div","med-name", medLine(c)));
      row.appendChild(el("div","med-meta", fmtDate(c.start) + " to " + fmtDate(c.end)));
      view.appendChild(row);
    });
  }

  /* --- did it make a difference --- */
  var chHead = el("div","daylabel","Did it make a difference");
  chHead.style.marginTop = "26px";
  view.appendChild(chHead);

  var all = sortedChanges();
  if(!all.length){
    var emp = el("div","empty");
    emp.appendChild(el("h2", null, "Nothing logged yet"));
    emp.appendChild(el("p", null, "Use the button below to log the day a medication started, a therapy began, or a school year changed. Kasey compares the 30 days either side using entries you already have."));
    view.appendChild(emp);
    return;
  }

  all.forEach(function(c){
    var cmp = compareChange(c, 30);
    var card = el("div","mk");
    var top = el("div","mk-top");
    top.appendChild(el("h4", null, c.kind === "med" ? medLine(c) : c.label));
    top.appendChild(el("span","date", fmtDate(c.start)));
    card.appendChild(top);

    var tag = el("div","mk-thin");
    tag.style.marginTop = "3px";
    tag.textContent = kindLabel(c.kind) + (c.end ? " · stopped " + fmtDate(c.end) : "");
    card.appendChild(tag);

    if(cmp.before.episodes < 3 || cmp.after.episodes < 3){
      card.appendChild(el("p","mk-thin",
        "Not enough logged either side yet — " + cmp.before.episodes + " episodes in the 30 days before, " +
        cmp.after.episodes + " in the " + cmp.afterDays + " days after. Three each side is the minimum before a comparison means anything."));
    } else {
      function cmpRow(label, bVal, aVal, bTxt, aTxt, lowerBetter){
        var row = el("div","cmp-row");
        row.appendChild(el("div","cmp-lab", label));
        var grid = el("div","cmp");
        var c1 = el("div","cmp-col");
        c1.appendChild(el("span","lab","30d before"));
        c1.appendChild(el("div","v", bTxt));
        grid.appendChild(c1);
        var pc = pctChange(bVal, aVal);
        var arrow = el("div","cmp-arrow","→");
        if(pc !== null && pc !== 0){
          var better = lowerBetter ? pc < 0 : pc > 0;
          arrow.textContent = pc < 0 ? "↓" : "↑";
          arrow.style.color = better ? "var(--deep)" : "var(--warn)";
          arrow.style.fontWeight = "700";
        }
        grid.appendChild(arrow);
        var c2 = el("div","cmp-col");
        c2.appendChild(el("span","lab", cmp.afterDays + "d after"));
        var v2 = el("div","v", aTxt);
        if(pc !== null && pc !== 0) v2.appendChild(el("small", null, (pc > 0 ? "+" : "") + pc + "%"));
        c2.appendChild(v2);
        grid.appendChild(c2);
        row.appendChild(grid);
        return row;
      }
      card.appendChild(cmpRow("How often", cmp.before.perWeek, cmp.after.perWeek,
        cmp.before.perWeek.toFixed(1) + "/wk", cmp.after.perWeek.toFixed(1) + "/wk", true));
      card.appendChild(cmpRow("How long", cmp.before.typical, cmp.after.typical,
        fmtMins(cmp.before.typical), fmtMins(cmp.after.typical), true));
      var bE = cmp.before.episodes ? Math.round(cmp.before.caughtEarly / cmp.before.episodes * 100) : 0;
      var aE = cmp.after.episodes ? Math.round(cmp.after.caughtEarly / cmp.after.episodes * 100) : 0;
      card.appendChild(cmpRow("Caught early", bE, aE, bE + "%", aE + "%", false));
      card.appendChild(el("p","mk-thin",
        "This compares what you logged, not what caused it. Other things changed in the same 60 days, and how consistently you logged may have changed too."));
    }

    var del = el("button","mk-del","Remove this"); del.type = "button";
    del.addEventListener("click", function(){
      askConfirm("Remove \"" + c.label + "\"? Your entries are not affected.", "Remove", function(){
        DATA.changes = DATA.changes.filter(function(x){ return x.id !== c.id; });
        save(); render(); toast("Removed");
      });
    });
    card.appendChild(del);
    view.appendChild(card);
  });
}

var changeDraft = null;
var replacingMed = null;
function saveChange(){
  var d = changeDraft;
  if(!d || !d.label.trim()){ toast(d && d.kind === "med" ? "Which medication?" : "Give it a short name"); return; }
  if(replacingMed){ replacingMed.end = d.start; }   // a dose change ends the old record
  DATA.changes.push(d);
  changeDraft = null; replacingMed = null;
  save(); closeSheet(); pageMode = "changes"; render();
  toast(d.kind === "med" ? "Medication logged" : "Change logged");
}
function addChange(opts){
  opts = opts || {};
  var now = new Date();
  var from = opts.from || null;
  replacingMed = from;
  var draft = { id:uid(), kind: from ? "med" : "", label: from ? from.label : "",
                dose:"", start:now.toISOString(), end:null, note:"" };
  changeDraft = draft;
  sheetMode = "change";
  editing = null;
  sheetTitle.textContent = from ? "Change the dose" : "Log a change";
  sheetSave.textContent = "Save";
  autosaveNote.hidden = true;
  clear(sheetBody);
  var rest = el("div");

  // 1. what kind of change is this? Everything else follows from the answer.
  if(!from){
    var fK = el("div","field");
    fK.appendChild(el("label", null, "What kind of change?"));
    var kChips = el("div","chips");
    CHANGE_KINDS.forEach(function(o){
      var b = el("button","chip", o.label); b.type = "button";
      b.setAttribute("aria-pressed","false");
      b.addEventListener("click", function(){
        draft.kind = o.k;
        Array.prototype.forEach.call(kChips.children, function(x){ x.setAttribute("aria-pressed","false"); });
        b.setAttribute("aria-pressed","true");
        paintRest();
      });
      kChips.appendChild(b);
    });
    fK.appendChild(kChips);
    sheetBody.appendChild(fK);
  }
  sheetBody.appendChild(rest);

  function paintRest(){
    clear(rest);
    if(!draft.kind) return;
    var isMed = draft.kind === "med";

    var f1 = el("div","field");
    var l1 = el("label");
    l1.textContent = isMed ? "Which medication " : "What changed ";
    l1.appendChild(el("span","hint", isMed ? "— brand or generic, whichever you say out loud" : "— short and specific"));
    f1.appendChild(l1);
    var t = el("input"); t.type = "text";
    t.placeholder = isMed ? "Ritalin IR" : "Started ABA twice a week";
    t.value = draft.label || "";
    if(from) t.readOnly = true;
    t.addEventListener("input", function(){ draft.label = t.value; });
    t.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); saveChange(); } });
    f1.appendChild(t);
    rest.appendChild(f1);

    if(isMed){
      var f2 = el("div","field");
      var l2 = el("label"); l2.textContent = "Dose and schedule ";
      l2.appendChild(el("span","hint","— exactly how you'd say it to the doctor"));
      f2.appendChild(l2);
      var dz = el("input"); dz.type = "text"; dz.placeholder = "10mg twice daily";
      dz.value = draft.dose || "";
      dz.addEventListener("input", function(){ draft.dose = dz.value; });
      f2.appendChild(dz);
      rest.appendChild(f2);
    }

    var f3 = el("div","field");
    f3.appendChild(el("label", null, isMed ? "First dose on" : "The day it started"));
    var dIn = el("input"); dIn.type = "date"; dIn.value = toDateInput(new Date(draft.start));
    dIn.addEventListener("change", function(){
      var nd = fromInputs(dIn.value, "12:00");
      if(nd) draft.start = nd.toISOString();
    });
    f3.appendChild(dIn);
    rest.appendChild(f3);

    var f4 = el("div","field");
    var l4 = el("label"); l4.textContent = "Why ";
    l4.appendChild(el("span","hint","— optional, but you'll want it in six months"));
    f4.appendChild(l4);
    var nt = el("input"); nt.type = "text";
    nt.value = draft.note || "";
    nt.placeholder = isMed ? "Raised for focus at school" : "";
    nt.addEventListener("input", function(){ draft.note = nt.value; });
    f4.appendChild(nt);
    rest.appendChild(f4);

    var note = el("div","banner info");
    note.textContent = from
      ? "The old dose is closed off on this date and kept in the history, so the doctor can see the whole sequence."
      : (isMed
        ? "Medications can overlap. Logging a new one does not stop the others — mark those stopped yourself when they end."
        : "Kasey compares the 30 days before this against the 30 days after.");
    rest.appendChild(note);

    setTimeout(function(){ if(!from) t.focus(); }, 40);
  }
  paintRest();
  openSheet();
}

/* ============================================================
   SETTINGS
   ============================================================ */
function renderSettings(){
  var s = DATA.settings;
  topTitle.textContent = "Setup";
  topSub.textContent = persistent ? "Saved on this device" : "Not saved — export to keep";

  function textField(label, hint, key, multiline, placeholder){
    var f = el("div","field");
    var l = el("label"); l.textContent = label + " ";
    if(hint) l.appendChild(el("span","hint","— " + hint));
    f.appendChild(l);
    var input = multiline ? el("textarea") : el("input");
    if(!multiline) input.type = "text";
    input.value = s[key] || "";
    if(placeholder) input.placeholder = placeholder;
    input.addEventListener("input", function(){ s[key] = input.value; });
    input.addEventListener("blur", function(){ save(); });
    f.appendChild(input);
    return f;
  }

  var lock = el("div","lockup");
  lock.appendChild(mark("kcTile"));

/* ============================================================

function download(filename, text, mime){
  try{
    var blob = new Blob([text], {type: mime || "text/plain;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 600);
    toast("Exported " + filename);
  }catch(e){ toast("Export blocked here — try a browser tab"); }
}
function csvCell(v){
  v = (v === undefined || v === null) ? "" : String(v);
  return '"' + v.replace(/"/g,'""') + '"';
}
function exportCSV(){
  if(!DATA.entries.length){ toast("Nothing to export yet"); return; }
  var rows = [["Date","Time","Kind","Stage","Where","What set it off","What it looked like","Back to baseline (min)","What helped","Flagged","Note"]];
  sortedEntries().slice().reverse().forEach(function(e){
    var d = new Date(e.at);
    var st = e.kind === "good" ? "" : ((e.stage||"") + (STAGES[(e.stage||1)-1] ? " " + STAGES[(e.stage||1)-1].name : ""));
    rows.push([
      toDateInput(d), toTimeInput(d), e.kind === "good" ? "Good day" : "Episode", st,
      e.source || "Home", e.trigger || "", (e.behaviors||[]).join("; "),
      e.kind === "good" ? "" : e.minutes, (e.tools||[]).join("; "),
      e.flagged ? "Yes" : "", e.note || ""
    ]);
  });
  var csv = rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n");
  download("kasey-log.csv", "\ufeff" + csv, "text/csv;charset=utf-8");
}
function exportJSON(){ download("kasey-backup.json", JSON.stringify(DATA, null, 2), "application/json"); }

function askForNote(){
  var name = DATA.settings.childName || "my child";
  var msg = "Hi — I'm keeping a short log of " + name + "'s hard moments so I can spot patterns and share them with " +
    "our doctor. If something happens while " + name + " is with you, could you text me four quick things? " +
    "1) roughly when, 2) what happened right before, 3) how far it got, 4) how long until they were back to themselves, " +
    "and anything that helped. A sentence is plenty. Good days are worth a text too. Thank you.";
  function showIt(){
    sheetMode = "note"; editing = null;
    sheetTitle.textContent = "Message to send";
    sheetSave.textContent = "Done";
    clear(sheetBody);
    var f = el("div","field");
    f.appendChild(el("label", null, "Copy this and text it to them"));
    var ta = el("textarea"); ta.value = msg; ta.style.minHeight = "190px"; ta.readOnly = true;
    f.appendChild(ta);
    sheetBody.appendChild(f);
    openSheet();
    setTimeout(function(){ ta.select(); }, 60);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg).then(
      function(){ toast("Message copied — paste it into a text"); }, showIt);
  } else showIt();
}

Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
  t.addEventListener("click", function(){ current = t.dataset.tab; window.scrollTo(0,0); render(); });
});
function buildDock(){
  clear(dock);
  dock.classList.remove("one");
  var show = true;
  setTimeout(function(){ document.body.classList.toggle("has-dock", !dock.hidden); }, 0);

  if(current === "log"){
    var st = todayState();
    var g = el("button","b-good"); g.type = "button";
    g.textContent = st.good ? "Day marked good" : (st.hard ? "Still a good day" : "Good day");
    g.setAttribute("aria-pressed", st.good ? "true" : "false");
    g.addEventListener("click", function(){
      var s2 = todayState();
      if(s2.good){ editGoodDay(s2.good); return; }
      logGoodDay();
    });
    var b = el("button","b-hard","Something happened"); b.type = "button";
    b.addEventListener("click", function(){ editEntry(null, DATA.draft || null); });
    dock.appendChild(g); dock.appendChild(b);
    dock.hidden = false;
    return;
  }

  if(current === "page" && pageMode === "changes"){
    dock.classList.add("one");
    var c = el("button","b-plain","Log a change"); c.type = "button";
    c.addEventListener("click", function(){ addChange(); });
    dock.appendChild(c);
    dock.hidden = false;
    return;
  }

  if(current === "page" && analyse().allDays){
    dock.classList.add("one");
    var pr = el("button","b-plain","Print this page"); pr.type = "button";
    pr.addEventListener("click", function(){ window.print(); });
    dock.appendChild(pr);
    dock.hidden = false;
    return;
  }

  dock.hidden = true;   // Read and Setup have no single action
}

// A quiet signal that today has nothing in it, visible from every tab.
function refreshPip(){
  var k = toDateInput(new Date());
  var logged = DATA.entries.some(function(e){ return toDateInput(new Date(e.at)) === k; });
  var tab = document.querySelector('.tab[data-tab="log"]');
  var pip = tab.querySelector(".pip");
  if(logged || !DATA.entries.length){ if(pip) pip.remove(); return; }
  if(!pip){
    pip = el("span","pip");
    pip.setAttribute("aria-label","nothing logged today");
    tab.appendChild(pip);
  }
}

function todayState(){
  var k = toDateInput(new Date());
  var st = {good:null, hard:0};
  DATA.entries.forEach(function(e){
    if(toDateInput(new Date(e.at)) !== k) return;
    if(e.kind === "good") st.good = e; else st.hard++;
  });
  return st;
}
