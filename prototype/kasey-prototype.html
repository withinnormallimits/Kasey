<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasey</title>
<meta name="theme-color" id="themeColor" content="#F1F3EF">
<link rel='icon' href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="18" y1="28" x2="52" y2="92"><stop offset="0" stop-color="%23FDE07A"/><stop offset=".52" stop-color="%23F0A02E"/><stop offset="1" stop-color="%23C4610F"/></linearGradient><linearGradient id="t" gradientUnits="userSpaceOnUse" x1="57" y1="38" x2="102" y2="84"><stop offset="0" stop-color="%236EE7D8"/><stop offset=".55" stop-color="%233BB4CE"/><stop offset="1" stop-color="%234A8FD4"/></linearGradient></defs><rect width="120" height="120" rx="27" fill="%23FBF3E4"/><g fill="none" stroke="url(%23g)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M25,32V88"/><path d="M42,32L28,60L44,88"/></g><path d="M96,42.8A21,21 0 1 0 96,77.2" fill="none" stroke="url(%23t)" stroke-width="12" stroke-linecap="round"/><circle cx="84" cy="60" r="10.5" fill="%235FD6C4"/></svg>'><defs><linearGradient id="g" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="%23FDE07A"/><stop offset=".52" stop-color="%23F0A02E"/><stop offset="1" stop-color="%23C4610F"/></linearGradient><linearGradient id="t" x1=".1" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%236EE7D8"/><stop offset=".55" stop-color="%233BB4CE"/><stop offset="1" stop-color="%234A8FD4"/></linearGradient></defs><rect width="120" height="120" rx="27" fill="%23FBF3E4"/><g fill="none" stroke="url(%23g)" stroke-width="13" stroke-linecap="round"><path d="M28,32V88"/><path d="M52,33L31,60"/><path d="M32,58L54,88"/></g><path d="M94.6,42A22,22 0 1 0 94.6,78" fill="none" stroke="url(%23t)" stroke-width="13" stroke-linecap="round"/><circle cx="82" cy="60" r="10.5" fill="%235FD6C4"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* light — verified against WCAG AA */
    --bg:#E6E9E4;
    --paper:#F1F3EF; --card:#FFFFFF;
    --ink:#16201F; --ink-2:#3C4A48; --ink-3:#5E6D69;
    --line:#DDE2DC;          /* decorative divider */
    --edge:#7C8A84;          /* interactive border, 3.6:1 */
    --line-2:#EDF0EC;
    --deep:#2C574B; --on-deep:#FFFFFF; --deep-soft:#E4EDE8; --on-deep-soft:var(--on-deep-soft);
    --good:#3C7554; --good-soft:#E8F1EA; --on-good-soft:var(--on-good-soft);
    --warn:#A8503C; --warn-soft:#F6E7E3; --on-warn-soft:var(--on-warn-soft);
    /* sequential recovery ramp — one hue, varies by lightness */
    --s1:#BBD2C7; --s2:#8FB5A5; --s3:#639784; --s4:#3E7864; --s5:#25584A;
    --track:#E4E9E5;
    --shadow:0 1px 2px rgba(22,32,31,.05), 0 6px 20px rgba(22,32,31,.07);
    --r:12px; --tap:48px;
  }
  [data-theme="dark"]{
    --bg:#0D1111;
    --paper:#151A19; --card:#1E2524;
    --ink:#E4EAE7; --ink-2:#B9C4C0; --ink-3:#97A5A1;
    --line:#2A3332;
    --edge:#6E7B77;          /* 3.5:1 */
    --line-2:#232B2A;
    --deep:#6FC2A3; --on-deep:#0C1714; --deep-soft:#1B2E28; --on-deep-soft:#8FD6B8;
    --good:#6FC2A3; --good-soft:#172A23; --on-good-soft:#8FD6B8;
    --warn:#E0906E; --warn-soft:#33201A; --on-warn-soft:#F0AE90;
    --s1:#2F5346; --s2:#3E7864; --s3:#559A80; --s4:#74BC9C; --s5:#9BD9BC;
    --track:#2A3332;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Public Sans",system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea,select{font-family:inherit;font-size:16px;color:inherit;} /* 16px stops iOS zoom */
  :focus-visible{outline:2px solid var(--deep);outline-offset:2px;border-radius:4px;}

  #app{
    max-width:460px;margin:0 auto;min-height:100%;background:var(--paper);
    display:flex;flex-direction:column;position:relative;
    box-shadow:0 0 60px rgba(22,32,31,.10);
  }
  .topbar{
    flex:none;padding:16px 18px 12px;background:var(--paper);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .topbar h1{font-family:"Newsreader",serif;font-weight:400;font-size:25px;margin:0;letter-spacing:-.01em;line-height:1.1;}
  .topbar .sub{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);display:block;margin-top:2px;}
  .topbtn{font-size:14px;font-weight:600;color:var(--deep);padding:10px 4px;flex:none;min-height:var(--tap);display:flex;align-items:center;}
  main{flex:1;padding:14px 18px 100px;}
  body.has-dock main{padding-bottom:160px;}

  .tabbar{
    position:sticky;bottom:0;flex:none;display:grid;grid-template-columns:repeat(4,1fr);
    background:rgba(241,243,239,.96);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);z-index:20;
  }
  .tab{
    padding:10px 4px calc(10px + env(safe-area-inset-bottom));
    text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-3);min-height:var(--tap);
  }
  .tab .ic{display:block;font-size:17px;line-height:1.3;margin-bottom:1px;}
  .tab[aria-current="true"]{color:var(--deep);}

  /* two-button dock, thumb zone */
  .dock{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(72px + env(safe-area-inset-bottom));
    width:min(424px,calc(100% - 36px));z-index:25;
    display:grid;grid-template-columns:1fr 1.25fr;gap:9px;
  }
  .dock.one{grid-template-columns:1fr;}
  .dock button{
    min-height:56px;border-radius:var(--r);font-weight:600;font-size:15.5px;
    display:flex;align-items:center;justify-content:center;gap:7px;
    box-shadow:0 5px 18px rgba(22,32,31,.16);
  }
  .dock .b-plain{background:var(--deep);color:var(--on-deep);}
  .tab{position:relative;}
  .tab .pip{
    position:absolute;top:6px;left:calc(50% + 9px);
    width:7px;height:7px;border-radius:50%;background:var(--warn);
    box-shadow:0 0 0 2px var(--paper);
  }
  .dock .b-good{background:var(--card);color:var(--good);border:1.5px solid var(--good);}
  .dock .b-good[aria-pressed="true"]{background:var(--good-soft);}
  .dock .b-hard{background:var(--deep);color:var(--on-deep);}
  .dock button:active{transform:scale(.98);}

  /* ---------- brand ---------- */
  .kc{display:block;flex:none;}
  .lockup{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:26px 18px 24px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);margin-bottom:18px;
  }
  .lockup .kc{width:76px;height:76px;border-radius:18px;box-shadow:var(--shadow);}
  .wordmark{
    font-family:"Fraunces",Newsreader,serif;font-weight:600;font-size:31px;
    letter-spacing:-.015em;color:var(--ink);margin:15px 0 0;line-height:1;
  }
  [data-theme="dark"] .wordmark{color:var(--ink);}
  .lockup .tag{
    font-family:"Newsreader",serif;font-style:italic;font-weight:300;
    font-size:16px;color:var(--ink-3);margin-top:8px;
  }
  .lockup .ver{
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-3);margin-top:14px;
  }
  .p-masthead{display:flex;align-items:center;gap:11px;margin-bottom:13px;}
  .p-masthead .kc{width:30px;height:30px;}
  .p-masthead .nm{
    font-family:"Fraunces",Newsreader,serif;font-weight:600;font-size:17px;
    color:#22506B;letter-spacing:-.01em;
  }
  .p-masthead .rule{flex:1;height:1px;background:#DDE2DC;}
  .empty .kc{width:58px;height:58px;margin:0 auto 18px;border-radius:14px;opacity:.9;}

  /* ---------- summary strip ---------- */
  .strip{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:15px;margin-bottom:16px;}
  .strip .lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:10px;}
  .strip-row{display:flex;gap:16px;}
  .strip-stat{flex:1;min-width:0;}
  .strip-stat .n{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;line-height:1;display:block;letter-spacing:-.02em;}
  .strip-stat .n small{font-size:11px;font-weight:400;color:var(--ink-3);margin-left:3px;letter-spacing:0;}
  .strip-stat .t{font-size:11.5px;color:var(--ink-3);display:block;margin-top:5px;line-height:1.35;}
  .strip .go{margin-top:12px;padding-top:11px;border-top:1px solid var(--line-2);
    font-size:12.5px;color:var(--deep);font-weight:600;display:flex;justify-content:space-between;}
  .ratio-lab{display:flex;justify-content:space-between;margin-top:6px;
    font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.06em;}
  .ramp{display:flex;align-items:center;gap:8px;margin:10px 0 0;}
  .ramp .swatches{display:flex;gap:2px;flex:none;}
  .ramp .swatches i{width:13px;height:7px;border-radius:2px;display:block;}
  .ramp .cap{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);letter-spacing:.06em;}
  .ratio{height:6px;border-radius:3px;background:var(--good-soft);overflow:hidden;margin-top:12px;display:flex;}
  .ratio span{height:100%;display:block;}

  /* ---------- entries ---------- */
  .daylabel{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-3);margin:18px 0 9px;}
  .daylabel:first-child{margin-top:2px;}
  .entry{width:100%;text-align:left;display:block;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;min-height:var(--tap);}
  .entry:active{background:#FAFBF9;}
  .entry-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .entry-trigger{font-weight:600;font-size:15px;line-height:1.3;}
  .entry-time{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;}
  .entry-what{font-size:13px;color:var(--ink-2);margin:3px 0 10px;}
  .recovery{display:flex;align-items:center;gap:9px;}
  .rbar{height:7px;border-radius:4px;flex:1;background:var(--track);overflow:hidden;}
  .rfill{height:100%;border-radius:4px;display:block;}
  .rmin{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--ink-2);flex:none;min-width:46px;text-align:right;}
  .rtool{font-size:12px;color:var(--deep);margin-top:8px;display:flex;align-items:center;gap:6px;}
  .rtool .dot{width:6px;height:6px;border-radius:50%;background:var(--deep);flex:none;}
  .rtool.none{color:var(--warn);}
  .rtool.none .dot{background:var(--warn);}
  .entry-note{font-size:12.5px;color:var(--ink-3);margin-top:8px;font-style:italic;}
  .stage-tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;border-radius:5px;padding:2px 6px;flex:none;
    background:var(--deep-soft);color:var(--on-deep-soft);}
  .stage-tag.s4{background:var(--warn-soft);color:var(--on-warn-soft);}
  .stage-tag.s1{background:var(--good-soft);color:var(--on-good-soft);}
  .src-tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;flex:none;}

  .goodrow{width:100%;text-align:left;display:flex;align-items:center;gap:11px;
    background:var(--good-soft);border:1px solid var(--line);
    border-radius:10px 10px 4px 4px;
    padding:12px 14px;margin-bottom:5px;min-height:var(--tap);}
  .goodrow.has-below{border-bottom-left-radius:4px;border-bottom-right-radius:4px;}
  .day-stack{border-left:2px solid var(--good-soft);padding-left:9px;margin-bottom:14px;}
  .day-stack.no-verdict{border-left-color:transparent;padding-left:0;}
  .verdict-note{font-size:12.5px;color:var(--ink-3);margin:0 0 9px 3px;font-style:italic;}
  .goodrow .dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;}
  .goodrow .txt{font-size:14.5px;font-weight:600;color:var(--on-good-soft);}
  .goodrow .note{font-size:13px;color:var(--on-good-soft);font-weight:400;}
  .goodrow .t{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--on-good-soft);flex:none;}

  .mhead{display:flex;width:100%;align-items:center;gap:10px;text-align:left;
    padding:13px 2px;border-bottom:1px solid var(--line);margin-bottom:2px;min-height:var(--tap);}
  .mhead .caret{font-size:11px;color:var(--ink-3);flex:none;width:12px;transition:transform .16s ease;display:inline-block;}
  .mhead[aria-expanded="true"] .caret{transform:rotate(90deg);}
  .mhead .name{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600;}
  .mhead .cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);}
  .mgroup{padding-top:10px;}

  .empty{text-align:center;padding:44px 20px;color:var(--ink-3);}
  .empty h2{font-family:"Newsreader",serif;font-weight:400;font-size:23px;color:var(--ink);margin:0 0 8px;}
  .empty p{font-size:14.5px;margin:0 auto 20px;max-width:290px;line-height:1.55;}

  /* ---------- form ---------- */
  .field{margin-bottom:22px;}
  .field > label,.flabel{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:9px;}
  .hint{font-weight:400;color:var(--ink-3);font-size:12px;}
  input[type="date"],input[type="time"],input[type="text"],textarea{
    background:var(--card);border:1px solid var(--edge);border-radius:10px;
    padding:13px 12px;width:100%;color:var(--ink);min-height:var(--tap);}
  textarea{resize:vertical;min-height:70px;line-height:1.5;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{border:1px solid var(--edge);background:var(--card);border-radius:22px;
    padding:0 15px;min-height:44px;display:inline-flex;align-items:center;
    font-size:14px;color:var(--ink-2);transition:background .12s ease,border-color .12s ease,color .12s ease;}
  .chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:var(--on-deep);font-weight:600;}
  .chip.nothing[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);}
  .chip.add{border-style:dashed;color:var(--ink-3);}
  .chip.unknown[aria-pressed="true"]{background:var(--ink-3);border-color:var(--ink-3);}
  .addrow{display:flex;gap:7px;margin-top:9px;}
  .addrow input{flex:1;}
  .addrow button{background:var(--deep);color:var(--on-deep);border-radius:10px;padding:0 17px;font-weight:600;font-size:14px;flex:none;min-height:var(--tap);}

  /* stage picker — the primary control */
  .stages{display:flex;flex-direction:column;gap:8px;}
  .stage{display:flex;align-items:flex-start;gap:12px;text-align:left;
    border:1px solid var(--edge);background:var(--card);border-radius:11px;
    padding:13px 14px;min-height:56px;}
  .stage .num{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
    color:var(--ink-3);flex:none;width:14px;padding-top:2px;}
  .stage .body{flex:1;min-width:0;}
  .stage .nm{font-size:15px;font-weight:600;line-height:1.3;display:block;}
  .stage .ds{font-size:12.5px;color:var(--ink-3);line-height:1.45;display:block;margin-top:2px;}
  .stage[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);}
  .stage[aria-pressed="true"] .nm,.stage[aria-pressed="true"] .num{color:var(--on-deep);}
  .stage[aria-pressed="true"] .ds{color:var(--on-deep);opacity:.8;}
  .stage.s1[aria-pressed="true"]{background:var(--good);border-color:var(--good);}
  .stage.s4[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);}

  .slider-wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 14px 12px;}
  .slider-val{font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:600;line-height:1;}
  .slider-val span{font-size:13px;font-weight:400;color:var(--ink-3);margin-left:5px;}
  .slider-preview{height:7px;border-radius:4px;background:var(--track);overflow:hidden;margin:12px 0 8px;}
  input[type=range]{width:100%;accent-color:var(--deep);height:32px;}
  .quickmins{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;}
  .quickmins button{border:1px solid var(--line);border-radius:9px;padding:0 13px;min-height:44px;
    display:inline-flex;align-items:center;
    font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);background:var(--card);}

  .more-toggle{width:100%;text-align:center;color:var(--deep);font-weight:600;font-size:14.5px;
    padding:14px;border:1px dashed var(--line);border-radius:11px;min-height:var(--tap);margin-bottom:8px;}

  .banner{border-radius:10px;padding:12px 13px;font-size:13px;line-height:1.5;margin-bottom:18px;}
  .banner.info{background:var(--deep-soft);color:var(--on-deep-soft);}
  .banner.warn{background:var(--warn-soft);color:var(--on-warn-soft);}
  .banner.good{background:var(--good-soft);color:var(--on-good-soft);}
  .banner button{font-weight:700;text-decoration:underline;margin-left:6px;}

  .btn-primary{width:100%;background:var(--deep);color:var(--on-deep);font-weight:600;font-size:16px;
    padding:16px;border-radius:var(--r);text-align:center;margin-top:6px;min-height:56px;}
  .btn-ghost{width:100%;background:var(--card);color:var(--warn);font-weight:600;font-size:15px;
    padding:15px;border-radius:var(--r);text-align:center;border:1px solid var(--line);margin-top:10px;min-height:var(--tap);}
  .btn-quiet{width:100%;background:var(--card);color:var(--ink-2);font-weight:600;font-size:14.5px;
    padding:14px;border-radius:10px;text-align:center;border:1px solid var(--line);margin-bottom:9px;min-height:var(--tap);}
  .meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);line-height:1.8;margin-top:20px;}

  /* ---------- pages ---------- */
  .paper{
    background:#FFFFFF;border:1px solid #DDE2DC;border-radius:8px;padding:24px 22px;
    box-shadow:0 1px 3px rgba(0,0,0,.10), 0 10px 30px rgba(0,0,0,.10);
    --ink:#16201F; --ink-2:#3C4A48; --ink-3:#5E6D69;
    --line:#DDE2DC; --deep:#2C574B; --warn:#A8503C;
    --good-soft:#E8F1EA; --on-good-soft:#2F5E44;
    color:#16201F;
  }
  .p-head{padding-bottom:15px;border-bottom:2px solid var(--ink);margin-bottom:20px;}
  .p-head h2{font-family:"Newsreader",serif;font-weight:400;font-size:27px;margin:0 0 3px;letter-spacing:-.01em;}
  .p-head .who{font-size:13px;color:var(--ink-2);}
  .p-head .gen{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-top:9px;line-height:1.7;}
  .p-block{margin-bottom:22px;}
  .p-block h3{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--deep);margin:0 0 10px;font-weight:600;}
  .p-block.warn h3{color:var(--warn);}
  .p-block.hero{background:var(--good-soft);border-radius:10px;padding:16px 17px;margin:-4px 0 22px;}
  .p-block.hero h3{color:var(--on-good-soft);}
  .p-block.hero p{color:var(--on-good-soft);}
  .p-list{list-style:none;margin:0;padding:0;}
  .p-list li{display:flex;justify-content:space-between;gap:14px;align-items:baseline;
    padding:6px 0;border-bottom:1px dotted var(--line);font-size:14.5px;}
  .p-list li:last-child{border-bottom:none;}
  .p-list .val{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);flex:none;}
  .p-list .val.good{color:var(--deep);font-weight:600;}
  .p-prose{font-size:14px;color:var(--ink-2);margin:0;white-space:pre-wrap;}
  .p-foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);
    font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);line-height:1.7;}
  .p-stage{display:flex;gap:11px;padding:9px 0;border-bottom:1px dotted var(--line);align-items:flex-start;}
  .p-stage:last-child{border-bottom:none;}
  .p-stage .n{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--deep);flex:none;width:14px;padding-top:2px;}
  .p-stage .b{flex:1;}
  .p-stage .nm{font-size:14.5px;font-weight:600;display:block;}
  .p-stage .ds{font-size:13px;color:var(--ink-2);display:block;margin-top:1px;}
  .p-tbl{width:100%;border-collapse:collapse;font-size:14px;}
  .p-tbl td{padding:6px 0;border-bottom:1px dotted var(--line);}
  .p-tbl td:last-child{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);white-space:nowrap;padding-left:12px;}
  .p-tbl tr:last-child td{border-bottom:none;}

  .seg{display:grid;background:var(--line-2);border-radius:10px;padding:3px;margin-bottom:18px;gap:2px;}
  .seg button{padding:11px 6px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-3);text-align:center;line-height:1.2;min-height:44px;}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--deep);box-shadow:0 1px 2px rgba(22,32,31,.08);}

  .med{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 15px;margin-bottom:9px;}
  .med.past{opacity:.72;padding:11px 15px;}
  .med-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .med-name{font-size:16px;font-weight:600;line-height:1.3;}
  .med-dose{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--deep);
    display:block;margin-top:2px;}
  .med-since{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;}
  .med-meta{font-size:12.5px;color:var(--ink-3);margin-top:6px;}
  .med-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .med-acts button{border:1px solid var(--edge);border-radius:9px;min-height:42px;
    font-size:13.5px;font-weight:600;color:var(--ink-2);background:var(--card);}
  .mk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:12px;}
  .mk-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px;}
  .mk-top h4{font-size:16px;margin:0;font-weight:600;line-height:1.3;}
  .mk-top .date{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);flex:none;}
  .cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:14px 0 0;}
  .cmp-col{text-align:center;}
  .cmp-col .lab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:6px;}
  .cmp-col .v{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;line-height:1.1;}
  .cmp-col .v small{font-size:10.5px;font-weight:400;color:var(--ink-3);display:block;margin-top:3px;letter-spacing:0;}
  .cmp-arrow{font-size:15px;color:var(--ink-3);}
  .cmp-row{border-top:1px solid var(--line-2);padding-top:13px;margin-top:13px;}
  .cmp-lab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;font-weight:600;}
  .mk-thin{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin:12px 0 0;}
  .mk-del{font-size:12.5px;color:var(--warn);font-weight:600;margin-top:12px;padding:8px 0;min-height:40px;}

  /* ---------- reading ---------- */
  .read-intro{font-family:"Newsreader",serif;font-size:19px;line-height:1.45;color:var(--ink-2);margin:2px 2px 22px;font-weight:300;}
  .art-card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px;}
  .art-card:active{background:#FAFBF9;}
  .art-cover{padding:20px 18px 18px;color:#fff;position:relative;overflow:hidden;}
  .art-cover .mark{position:absolute;right:-12px;bottom:-30px;font-family:"Newsreader",serif;font-size:110px;line-height:1;opacity:.14;pointer-events:none;}
  .art-cover .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.82;display:block;margin-bottom:10px;}
  .art-cover h2{font-family:"Newsreader",serif;font-weight:400;font-size:24px;line-height:1.18;margin:0;letter-spacing:-.012em;position:relative;max-width:92%;}
  .art-meta{padding:14px 18px 16px;}
  .art-meta .dek{font-size:14px;color:var(--ink-2);line-height:1.5;margin:0 0 10px;}
  .art-meta .foot{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);display:flex;gap:10px;align-items:center;}
  .art-meta .foot .go{margin-left:auto;color:var(--deep);font-weight:600;}

  .reader{position:fixed;inset:0;z-index:70;background:var(--card);display:none;flex-direction:column;}
  .reader.open{display:flex;}
  .reader-progress{position:absolute;top:0;left:0;right:0;height:2px;background:var(--line-2);z-index:3;}
  .reader-progress span{display:block;height:100%;width:0;background:var(--deep);}
  .reader-head{flex:none;display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--card);max-width:460px;width:100%;margin:0 auto;}
  .reader-crumb{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58%;}
  .reader-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .reader-inner{max-width:460px;margin:0 auto;padding:0 22px 80px;}
  .a-hero{padding:30px 0 24px;border-bottom:1px solid var(--line);margin-bottom:26px;}
  .a-hero .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--deep);display:block;margin-bottom:12px;}
  .a-hero h1{font-family:"Newsreader",serif;font-weight:400;font-size:33px;line-height:1.14;letter-spacing:-.018em;margin:0 0 14px;}
  .a-hero .dek{font-family:"Newsreader",serif;font-weight:300;font-style:italic;font-size:18px;line-height:1.45;color:var(--ink-2);margin:0 0 16px;}
  .a-hero .stamp{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);line-height:1.8;}
  .a-p{font-size:16.5px;line-height:1.68;color:var(--ink);margin:0 0 17px;}
  .a-h{font-family:"Newsreader",serif;font-weight:500;font-size:23px;line-height:1.22;letter-spacing:-.01em;margin:34px 0 13px;}
  .a-sh{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--deep);margin:26px 0 9px;}
  .a-ul{margin:0 0 18px;padding-left:20px;}
  .a-ul li{font-size:16px;line-height:1.6;margin-bottom:9px;}
  .a-call{background:var(--deep-soft);border-radius:12px;padding:16px 17px;margin:22px 0;}
  .a-call .lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--deep);display:block;margin-bottom:8px;}
  .a-call p{margin:0;font-size:15.5px;line-height:1.6;color:var(--on-deep-soft);}
  .a-call.warn{background:var(--warn-soft);}
  .a-call.warn .lab{color:var(--warn);}
  .a-call.warn p{color:var(--on-warn-soft);}
  .a-quote{font-family:"Newsreader",serif;font-weight:300;font-size:22px;line-height:1.36;color:var(--ink);border-left:2px solid var(--deep);padding-left:18px;margin:26px 0;letter-spacing:-.008em;}
  .a-age{border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:11px;}
  .a-age .band{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--deep);display:block;margin-bottom:3px;}
  .a-age h4{font-size:16px;margin:0 0 7px;font-weight:600;line-height:1.3;}
  .a-age p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink-2);}
  .a-rule{border:none;border-top:1px solid var(--line);margin:34px 0 28px;}
  .a-src{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);}
  .a-src h5{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 11px;font-weight:600;}
  .a-src ul{margin:0;padding-left:17px;}
  .a-src li{font-size:12.5px;line-height:1.6;color:var(--ink-3);margin-bottom:7px;}
  .a-disc{font-size:12.5px;line-height:1.6;color:var(--ink-3);margin-top:20px;font-style:italic;}

  /* ---------- entry detail ---------- */
  .d-hero{padding:26px 0 20px;border-bottom:1px solid var(--line);margin-bottom:22px;}
  .d-hero .when{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:9px;}
  .d-hero h1{font-family:"Newsreader",serif;font-weight:400;font-size:30px;line-height:1.16;letter-spacing:-.016em;margin:0;}
  .d-sec{margin-bottom:22px;}
  .d-sec h4{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--deep);margin:0 0 9px;font-weight:600;}
  .d-sec p{margin:0;font-size:16px;line-height:1.55;color:var(--ink);}
  .d-sec .quiet{color:var(--ink-3);font-style:italic;}
  .d-pills{display:flex;flex-wrap:wrap;gap:6px;}
  .d-pill{background:var(--deep-soft);color:var(--on-deep-soft);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:500;}
  .d-pill.warn{background:var(--warn-soft);color:var(--on-warn-soft);}
  .d-rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .d-rec .big{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em;}
  .d-rec .big small{font-size:13px;font-weight:400;color:var(--ink-3);margin-left:5px;letter-spacing:0;}
  .d-rec .cmp2{font-size:12.5px;color:var(--ink-3);margin-top:10px;}
  .d-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:28px;}
  .d-actions button{padding:15px;border-radius:var(--r);font-weight:600;font-size:15px;text-align:center;min-height:52px;}
  .d-edit{background:var(--deep);color:var(--on-deep);}
  .d-del{background:var(--card);color:var(--warn);border:1px solid var(--line);}

  /* ---------- sheet: full height, sticky bottom action ---------- */
  .sheet{position:fixed;inset:0;z-index:60;display:none;}
  .sheet.open{display:block;}
  .sheet-bg{position:absolute;inset:0;background:rgba(22,32,31,.42);}
  .sheet-inner{
    position:absolute;left:50%;transform:translateX(-50%);bottom:0;
    width:100%;max-width:460px;
    height:100%;height:100dvh;                 /* dvh keeps the keyboard from covering fields */
    background:var(--paper);display:flex;flex-direction:column;
  }
  .sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;border-bottom:1px solid var(--line);gap:12px;background:var(--paper);}
  .sheet-head h2{font-family:"Newsreader",serif;font-weight:400;font-size:21px;margin:0;}
  .sheet-body{flex:1;overflow-y:auto;padding:16px 18px 26px;-webkit-overflow-scrolling:touch;}
  .sheet-foot{
    flex:none;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    background:var(--paper);border-top:1px solid var(--line);
  }
  .sheet-foot .btn-primary{margin-top:0;}
  .autosave{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);
    text-align:center;margin-top:9px;display:block;}

  .onb{position:fixed;inset:0;z-index:95;background:var(--paper);display:none;}
  .onb.open{display:block;}
  .onb-inner{max-width:460px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;}
  .onb-body{flex:1;overflow-y:auto;padding:34px 22px 20px;-webkit-overflow-scrolling:touch;}
  .onb-foot{flex:none;padding:14px 22px calc(16px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--paper);}
  .onb-skip{width:100%;text-align:center;color:var(--ink-3);font-size:14px;
    padding:14px 0 2px;min-height:44px;}
  .onb .kc{width:66px;height:66px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:22px;}
  .onb h1{font-family:"Fraunces",Newsreader,serif;font-weight:600;font-size:29px;
    line-height:1.18;letter-spacing:-.015em;margin:0 0 12px;}
  .onb .lede{font-family:"Newsreader",serif;font-weight:300;font-size:18.5px;
    line-height:1.5;color:var(--ink-2);margin:0 0 24px;}
  .onb .step{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--deep);display:block;margin-bottom:14px;}
  .onb .why{font-size:13.5px;color:var(--ink-3);line-height:1.55;margin:18px 0 0;}
  .onb-preview{background:#fff;border:1px solid #DDE2DC;border-radius:8px;
    padding:18px 18px 16px;box-shadow:var(--shadow);color:#16201F;margin-top:6px;}
  .onb-preview .pnm{font-family:"Newsreader",serif;font-size:21px;margin:0 0 2px;}
  .onb-preview .pwho{font-size:12px;color:#5E6D69;margin-bottom:13px;}
  .onb-preview .plab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#2F5E44;margin:0 0 6px;font-weight:600;}
  .onb-preview .pln{font-size:14px;line-height:1.5;margin:0 0 4px;color:#3C4A48;}
  .ask{position:fixed;inset:0;z-index:90;display:none;}
  .ask.open{display:block;}
  .ask-bg{position:absolute;inset:0;background:rgba(10,16,15,.55);}
  .ask-box{
    position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:100%;max-width:460px;background:var(--paper);
    border-top-left-radius:18px;border-top-right-radius:18px;
    padding:24px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 40px rgba(0,0,0,.3);
  }
  .ask-box p{margin:0 0 20px;font-size:16.5px;line-height:1.5;color:var(--ink);}
  .ask-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .ask-row button{min-height:52px;border-radius:var(--r);font-weight:600;font-size:15.5px;}
  .ask-no{background:var(--card);color:var(--ink-2);border:1px solid var(--edge);}
  .ask-yes{background:var(--warn);color:#fff;}
  .toast{position:fixed;bottom:calc(140px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:500;padding:12px 18px;border-radius:24px;z-index:80;
    opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;
    display:flex;align-items:center;gap:14px;max-width:calc(100% - 36px);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .toast button{color:#8FD6B4;font-weight:700;flex:none;padding:4px 0;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  @media print{
    body{background:#fff;}
    #app{box-shadow:none;max-width:none;}
    .topbar,.tabbar,.dock,.noprint{display:none!important;}
    .p-masthead{display:flex!important;}
    main{padding:0;}
    .paper{border:none;box-shadow:none;padding:0;}
  }
</style>
</head>
<body>

<!-- ============ kc mark · from Idea Vault §8 ============
     Gold K beside a teal C, calm face resting in the bowl of the C.
     kcTile   — app icon master, cream tile
     kcPlain  — transparent, for the document masthead
     kcSmall  — 40px variant: features dropped, face reads as a plain dot
============================================================ -->
<svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true" focusable="false">
  <defs>
    <!-- userSpaceOnUse: one ribbon of gradient across the whole letter.
         objectBoundingBox gives each stroke its own ramp, and drops the vertical
         stem entirely because a vertical line has a zero-width bounding box. -->
    <linearGradient id="kcGold" gradientUnits="userSpaceOnUse" x1="18" y1="28" x2="52" y2="92">
      <stop offset="0%"   stop-color="#FDE07A"/>
      <stop offset="52%"  stop-color="#F0A02E"/>
      <stop offset="100%" stop-color="#C4610F"/>
    </linearGradient>
    <linearGradient id="kcTeal" gradientUnits="userSpaceOnUse" x1="57" y1="38" x2="102" y2="84">
      <stop offset="0%"   stop-color="#6EE7D8"/>
      <stop offset="55%"  stop-color="#3BB4CE"/>
      <stop offset="100%" stop-color="#4A8FD4"/>
    </linearGradient>
    <g id="kcLetters">
      <g fill="none" stroke="url(#kcGold)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <path d="M25,32 V88"/>
        <path d="M42,32 L28,60 L44,88"/>
      </g>
      <path d="M96,42.8 A21,21 0 1 0 96,77.2" fill="none" stroke="url(#kcTeal)"
            stroke-width="12" stroke-linecap="round"/>
    </g>
    <g id="kcFace">
      <circle cx="84" cy="60" r="10.5" fill="#5FD6C4"/>
      <g fill="none" stroke="#22506B" stroke-width="2.1" stroke-linecap="round">
        <path d="M77,58.3 q3,-3 6,0"/>
        <path d="M85,58.3 q3,-3 6,0"/>
        <path d="M80,64.2 q4,3.6 8,0"/>
      </g>
    </g>
  </defs>

  <symbol id="kcPlain" viewBox="0 0 120 120">
    <use href="#kcLetters"/><use href="#kcFace"/>
  </symbol>

  <symbol id="kcTile" viewBox="0 0 120 120">
    <rect x="0" y="0" width="120" height="120" rx="27" fill="#FBF3E4"/>
    <use href="#kcLetters"/><use href="#kcFace"/>
  </symbol>

  <symbol id="kcSmall" viewBox="0 0 120 120">
    <rect x="0" y="0" width="120" height="120" rx="27" fill="#FBF3E4"/>
    <use href="#kcLetters"/>
    <circle cx="84" cy="60" r="10.5" fill="#5FD6C4"/>
  </symbol>
</svg>

<div id="app">
  <div class="topbar">
    <div>
      <h1 id="topTitle">Log</h1>
      <span class="sub" id="topSub">—</span>
    </div>
    <button class="topbtn" id="topAction" type="button" hidden></button>
  </div>

  <main id="view"></main>

  <div class="dock" id="dock"></div>

  <nav class="tabbar">
    <button class="tab" data-tab="log" aria-current="true" type="button"><span class="ic">☰</span>Log</button>
    <button class="tab" data-tab="read" aria-current="false" type="button"><span class="ic">✧</span>Read</button>
    <button class="tab" data-tab="page" aria-current="false" type="button"><span class="ic">◫</span>Pages</button>
    <button class="tab" data-tab="settings" aria-current="false" type="button"><span class="ic">⚙</span>Setup</button>
  </nav>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-inner">
    <div class="sheet-head">
      <button class="topbtn" data-close type="button">Close</button>
      <h2 id="sheetTitle">Add an entry</h2>
      <span style="width:44px"></span>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot">
      <button class="btn-primary" id="sheetSave" type="button">Save entry</button>
      <span class="autosave" id="autosaveNote">Your draft is kept if you get interrupted</span>
    </div>
  </div>
</div>

<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
  <div class="reader-progress"><span id="readerBar"></span></div>
  <div class="reader-head">
    <button class="topbtn" id="readerBack" type="button">‹ Reading</button>
    <span class="reader-crumb" id="readerCrumb"></span>
  </div>
  <div class="reader-body" id="readerBody"></div>
</div>

<div class="reader" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <div class="reader-head">
    <button class="topbtn" id="detailBack" type="button">‹ Log</button>
    <span class="reader-crumb" id="detailCrumb"></span>
  </div>
  <div class="reader-body" id="detailBody"></div>
</div>

<div class="onb" id="onb" role="dialog" aria-modal="true" aria-labelledby="onbTitle">
  <div class="onb-inner">
    <div class="onb-body" id="onbBody"></div>
    <div class="onb-foot">
      <button class="btn-primary" id="onbNext" type="button">Start</button>
      <button class="onb-skip" id="onbSkip" type="button">Skip for now</button>
    </div>
  </div>
</div>

<div class="ask" id="ask" role="alertdialog" aria-modal="true" aria-labelledby="askMsg">
  <div class="ask-bg" data-ask-no></div>
  <div class="ask-box">
    <p id="askMsg"></p>
    <div class="ask-row">
      <button class="ask-no" id="askNo" type="button">Cancel</button>
      <button class="ask-yes" id="askYes" type="button">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============================================================
   STORAGE
   ============================================================ */
var KEY = "kasey:data:v2";
var THEME_KEY = "kasey:theme";
var memory = null;
var persistent = !!(window.storage && window.storage.get);

var STAGES = [
  {n:1, name:"Caught it early",   ds:"Pulled out of it before it took hold"},
  {n:2, name:"Shut down",         ds:"Went quiet, withdrew, stopped talking"},
  {n:3, name:"Argued through it", ds:"Defending, arguing, trying to regain control"},
  {n:4, name:"Full meltdown",     ds:"Lost it completely"}
];

function defaults(){
  return {
    settings:{
      onboarded:false,
      childName:"", childAge:"", contact:"",
      loves:"", proudOf:"", laughs:"",
      alwaysTrue:"", communication:"", pleaseDont:"", worthKnowing:"",
      theme:"auto",
      lib:{
        triggers:["Loud noise","Transition","Told no","Crowded","Clothing","Hungry","Tired","Unknown"],
        behaviors:["Crying","Screaming","Covering ears","Hitting","Withdrew","Bolted","Head-banging"],
        tools:["Headphones","Dark room","Weighted blanket","Deep pressure","Ride in car","Snack","Nothing we tried helped"],
        sources:["Home","School","Sitter","Therapy","Out"]
      }
    },
    entries:[],
    changes:[],   // typed: med / therapy / school / other. Meds may overlap.
    draft:null
  };
}
var DATA = defaults();

async function load(){
  if(!persistent){ DATA = memory || defaults(); return; }
  try{
    var r = await window.storage.get(KEY);
    if(r && r.value){ DATA = migrate(JSON.parse(r.value)); }
  }catch(e){}
}
async function save(){
  memory = DATA;
  if(!persistent) return;
  try{ await window.storage.set(KEY, JSON.stringify(DATA)); }
  catch(e){ toast("Couldn't save — showing unsaved copy"); }
}
/* ============================================================
   FIRST RUN — the point is that a real, printable page exists
   before a single episode is logged. 70% of people in this
   category quit before any log-based value could accrue.
   ============================================================ */
var onbStep = 0;
var onbEl, onbBody, onbNext, onbSkip;

function onbFields(){ return [
  {key:"childName", label:"What do you call them?", ph:"Avi", hint:"first name is fine"},
  {key:"loves",     label:"What do they love?",     ph:"Trains, anything with a map, his dog Rocket", hint:"the thing they'd talk about all day"},
  {key:"proudOf",   label:"What are they proud of?",ph:"Reading chapter books on his own", hint:""},
  {key:"laughs",    label:"What makes them laugh?", ph:"Silly voices and terrible knock-knock jokes", hint:""}
]; }

function startOnboarding(){
  onbEl = document.getElementById("onb");
  onbBody = document.getElementById("onbBody");
  onbNext = document.getElementById("onbNext");
  onbSkip = document.getElementById("onbSkip");
  onbStep = 0;
  onbEl.classList.add("open");
  document.body.style.overflow = "hidden";
  paintOnb();
}
function endOnboarding(goToPage){
  DATA.settings.onboarded = true;
  save();
  onbEl.classList.remove("open");
  document.body.style.overflow = "";
  if(goToPage){ current = "page"; pageMode = "handoff"; }
  render();
}

function paintOnb(){
  clear(onbBody);
  onbBody.scrollTop = 0;
  var s = DATA.settings;

  // --- welcome ---
  if(onbStep === 0){
    onbBody.appendChild(mark("kcTile"));
    var h1 = el("h1", null, "Before you log anything");
    h1.id = "onbTitle";
    onbBody.appendChild(h1);
    onbBody.appendChild(el("p","lede",
      "Four short questions and you'll have a page you can hand a sitter tonight. No episodes required."));
    var why = el("div","banner good");
    why.textContent = "Most apps in this category give you nothing until you've logged for weeks. This one starts with who your child is, because that's the part a sitter actually needs first.";
    onbBody.appendChild(why);
    onbNext.textContent = "Start";
    onbSkip.hidden = false;
    return;
  }

  // --- the four questions, one per screen ---
  var fields = onbFields();
  if(onbStep <= fields.length){
    var f = fields[onbStep - 1];
    onbBody.appendChild(el("span","step", "Question " + onbStep + " of " + fields.length));
    var q = el("h1", null, f.label);
    q.id = "onbTitle";
    onbBody.appendChild(q);
    if(f.hint) onbBody.appendChild(el("p","lede", f.hint));
    var inp = el("input"); inp.type = "text";
    inp.value = s[f.key] || "";
    inp.placeholder = f.ph;
    inp.setAttribute("aria-label", f.label);
    inp.addEventListener("input", function(){ s[f.key] = inp.value; });
    inp.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); onbAdvance(); }
    });
    onbBody.appendChild(inp);
    if(onbStep > 1){
      onbBody.appendChild(el("p","why",
        "This goes at the top of the page you hand people. A sitter who can start a conversation about trains prevents more hard moments than one who only knows the warning signs."));
    }
    onbNext.textContent = onbStep === fields.length ? "See my page" : "Next";
    onbSkip.hidden = false;
    setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 90);
    return;
  }

  // --- the payoff: a real page, right now ---
  var name = (s.childName || "").trim() || "Your child";
  onbBody.appendChild(el("span","step","Ready"));
  var d1 = el("h1", null, "That's a real page.");
  d1.id = "onbTitle";
  onbBody.appendChild(d1);
  onbBody.appendChild(el("p","lede",
    "You can print it or hand it over tonight. It fills itself in further every time you log something."));

  var pv = el("div","onb-preview");
  pv.appendChild(el("div","pnm", name + (s.childAge ? ", " + s.childAge : "")));
  pv.appendChild(el("div","pwho","For teachers, sitters, and anyone caring for " + name));
  pv.appendChild(el("div","plab","Start here"));
  if(s.loves)   pv.appendChild(el("p","pln","Loves: " + s.loves));
  if(s.proudOf) pv.appendChild(el("p","pln","Proud of: " + s.proudOf));
  if(s.laughs)  pv.appendChild(el("p","pln","Makes them laugh: " + s.laughs));
  if(!s.loves && !s.proudOf && !s.laughs){
    pv.appendChild(el("p","pln","Add a few lines in Setup and they'll appear here."));
  }
  onbBody.appendChild(pv);

  onbBody.appendChild(el("p","why",
    "Triggers, what helps, and how long they usually take to settle get added automatically as you log. Nothing here needs rewriting by hand."));
  onbNext.textContent = "Open my page";
  onbSkip.hidden = true;
}

function onbAdvance(){
  var fields = onbFields();
  if(onbStep > fields.length){ endOnboarding(true); return; }
  onbStep++;
  paintOnb();
}

function applyTheme(){
  var mode = (DATA.settings && DATA.settings.theme) || "auto";
  var dark = mode === "dark" ||
    (mode === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  if(dark) document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.removeAttribute("data-theme");
  var meta = document.getElementById("themeColor");
  if(meta) meta.setAttribute("content", dark ? "#151A19" : "#F1F3EF");
}
if(window.matchMedia){
  try{
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
      if(((DATA.settings||{}).theme || "auto") === "auto") applyTheme();
    });
  }catch(e){}
}

function migrate(d){
  var base = defaults();
  d = d || {};
  d.settings = Object.assign({}, base.settings, d.settings || {});
  d.settings.lib = Object.assign({}, base.settings.lib, (d.settings && d.settings.lib) || {});
  d.entries = Array.isArray(d.entries) ? d.entries : [];
  var legacy = Array.isArray(d.eras) ? d.eras
             : (Array.isArray(d.markers) ? d.markers.map(function(m){ return {id:m.id, label:m.label, start:m.at}; })
             : []);
  d.changes = Array.isArray(d.changes) ? d.changes : legacy.map(function(e){
    return {id:e.id, kind:"other", label:e.label, dose:"", start:e.start, end:null, note:""};
  });
  delete d.eras; delete d.markers;
  d.entries.forEach(function(e){
    if(!e.source) e.source = "Home";
    if(!e.kind) e.kind = "hard";
    if(e.kind === "hard" && !e.stage) e.stage = 4;
  });
  if(d.draft === undefined) d.draft = null;
  return d;
}

/* ============================================================
   HELPERS
   ============================================================ */
function uid(){ return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined && text !== null) n.textContent = text;
  return n;
}
function mark(symbol, cls){
  var s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("class", "kc" + (cls ? " " + cls : ""));
  s.setAttribute("viewBox","0 0 120 120");
  s.setAttribute("aria-hidden","true");
  s.setAttribute("focusable","false");
  var u = document.createElementNS("http://www.w3.org/2000/svg","use");
  u.setAttribute("href", "#" + symbol);
  s.appendChild(u);
  return s;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
function pad(n){ return n < 10 ? "0"+n : ""+n; }
function toDateInput(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function toTimeInput(d){ return pad(d.getHours())+":"+pad(d.getMinutes()); }
function fromInputs(dateStr, timeStr){
  var dp = (dateStr||"").split("-"), tp = (timeStr||"12:00").split(":");
  if(dp.length !== 3 || tp.length < 2) return null;
  var d = new Date(+dp[0], +dp[1]-1, +dp[2], +tp[0], +tp[1], 0, 0);
  return isNaN(d.getTime()) ? null : d;
}
var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MONS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtTime(d){
  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? "p" : "a";
  h = h % 12; if(h === 0) h = 12;
  return h + ":" + pad(m) + ap;
}
function fmtDayHeading(d){
  var today = new Date(); today.setHours(0,0,0,0);
  var that = new Date(d); that.setHours(0,0,0,0);
  var diff = Math.round((today - that) / 86400000);
  if(diff === 0) return "Today";
  if(diff === 1) return "Yesterday";
  if(diff > 1 && diff < 7) return DAYS[d.getDay()];
  return DAYS[d.getDay()] + ", " + MONS[d.getMonth()] + " " + d.getDate();
}
function fmtStamp(iso){
  var d = new Date(iso);
  return MONS[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()+" at "+fmtTime(d);
}
function fmtDate(iso){
  var d = new Date(iso);
  return MONS[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
function minsColor(m){
  if(m <= 15) return "var(--s1)";
  if(m <= 30) return "var(--s2)";
  if(m <= 60) return "var(--s3)";
  if(m <= 100) return "var(--s4)";
  return "var(--s5)";
}
function minsWidth(m){ return Math.max(6, Math.min(100, Math.round(m / 120 * 100))); }
function fmtMins(m){
  if(m < 60) return m + " min";
  var h = Math.floor(m/60), r = m % 60;
  return r ? h + "h " + r + "m" : h + "h";
}
function median(arr){
  if(!arr.length) return 0;
  var s = arr.slice().sort(function(a,b){ return a-b; });
  var mid = Math.floor(s.length/2);
  return s.length % 2 ? s[mid] : Math.round((s[mid-1]+s[mid])/2);
}
var askEl = document.getElementById("ask");
var askPending = null;
function askConfirm(message, yesLabel, onYes, noLabel, tone){
  document.getElementById("askMsg").textContent = message;
  document.getElementById("askYes").textContent = yesLabel || "Delete";
  document.getElementById("askNo").textContent = noLabel || "Cancel";
  document.getElementById("askYes").style.background =
    tone === "good" ? "var(--good)" : "var(--warn)";
  askPending = onYes;
  askEl.classList.add("open");
  document.getElementById("askNo").focus({preventScroll:true});
}
function askClose(){ askEl.classList.remove("open"); askPending = null; }
document.getElementById("askYes").addEventListener("click", function(){
  var fn = askPending; askClose(); if(fn) fn();
});
document.getElementById("askNo").addEventListener("click", askClose);
askEl.querySelector("[data-ask-no]").addEventListener("click", askClose);
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && askEl.classList.contains("open")) askClose();
});

var toastTimer = null;
function toast(msg, undoLabel, undoFn){
  var t = document.getElementById("toast");
  clear(t);
  t.appendChild(el("span", null, msg));
  if(undoLabel && undoFn){
    var b = el("button", null, undoLabel); b.type = "button";
    b.addEventListener("click", function(){ t.classList.remove("show"); undoFn(); });
    t.appendChild(b);
  }
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, undoFn ? 5000 : 2200);
}
function childName(){ return (DATA.settings.childName || "").trim() || "Your child"; }
function sortedEntries(){
  return DATA.entries.slice().sort(function(a,b){ return new Date(b.at) - new Date(a.at); });
}
function hardOnly(list){ return (list || DATA.entries).filter(function(e){ return e.kind !== "good"; }); }

/* ============================================================
   CHIP GROUP
   ============================================================ */
function chipGroup(opts){
  var wrap = el("div");
  var chips = el("div","chips");
  var selected = opts.selected.slice();

  function paint(){
    clear(chips);
    opts.items.forEach(function(name){
      var b = el("button","chip", name);
      b.type = "button";
      if(/^nothing we tried helped$/i.test(name) || /^nothing worked$/i.test(name)) b.classList.add("nothing");
      if(/^unknown$/i.test(name)) b.classList.add("unknown");
      b.setAttribute("aria-pressed", selected.indexOf(name) > -1 ? "true" : "false");
      b.addEventListener("click", function(){
        var i = selected.indexOf(name);
        var isNone = /^nothing/i.test(name);
        if(opts.multi){
          if(i > -1) selected.splice(i,1);
          else if(isNone) selected = [name];
          else {
            selected = selected.filter(function(s){ return !/^nothing/i.test(s); });
            selected.push(name);
          }
        } else {
          selected = (i > -1) ? [] : [name];
        }
        paint(); opts.onChange(selected);
      });
      chips.appendChild(b);
    });
    var add = el("button","chip add","+ Add");
    add.type = "button";
    add.addEventListener("click", function(){ addRow.hidden = false; addInput.focus(); });
    chips.appendChild(add);
  }

  var addRow = el("div","addrow");
  addRow.hidden = true;
  var addInput = el("input"); addInput.type = "text"; addInput.placeholder = "Add your own…";
  addInput.setAttribute("aria-label","Add your own option");
  var addBtn = el("button", null, "Add"); addBtn.type = "button";
  function commit(){
    var v = addInput.value.trim();
    if(!v) return;
    if(opts.items.some(function(x){ return x.toLowerCase() === v.toLowerCase(); })){
      toast("Already on the list"); addInput.value = ""; return;
    }
    opts.items.push(v);
    DATA.settings.lib[opts.libKey] = opts.items;
    if(opts.multi) selected.push(v); else selected = [v];
    addInput.value = ""; addRow.hidden = true;
    paint(); opts.onChange(selected); save();
  }
  addBtn.addEventListener("click", commit);
  addInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); commit(); } });
  addRow.appendChild(addInput); addRow.appendChild(addBtn);

  paint();
  wrap.appendChild(chips); wrap.appendChild(addRow);
  return wrap;
}

/* ============================================================
   SHEET
   ============================================================ */
var sheet = document.getElementById("sheet");
var sheetBody = document.getElementById("sheetBody");
var sheetTitle = document.getElementById("sheetTitle");
var sheetSave = document.getElementById("sheetSave");
var sheetFoot = document.getElementById("sheetFoot");
var autosaveNote = document.getElementById("autosaveNote");
var editing = null;
var sheetMode = "entry";

function openSheet(){
  sheetFoot.hidden = false;   // never leave a sheet without its save button
  sheet.classList.add("open");
  document.body.style.overflow = "hidden";
  sheetBody.scrollTop = 0;
}
function closeSheet(){
  sheet.classList.remove("open");
  document.body.style.overflow = "";
  editing = null;
}
function tryCloseSheet(){
  if(editing && editing.isNew && editing.dirty){
    askConfirm("Discard this entry? Your draft is saved, so you can pick it back up later.",
      "Discard", closeSheet);
    return;
  }
  closeSheet();
}
Array.prototype.forEach.call(sheet.querySelectorAll("[data-close]"), function(n){
  n.addEventListener("click", tryCloseSheet);
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && sheet.classList.contains("open")) tryCloseSheet();
});

/* keep the focused field above the keyboard */
sheetBody.addEventListener("focusin", function(e){
  var t = e.target;
  if(!t || !t.scrollIntoView) return;
  setTimeout(function(){
    try{ t.scrollIntoView({block:"center", behavior:"smooth"}); }catch(err){}
  }, 260);
});

/* ============================================================
   ENTRY EDITOR
   ============================================================ */
var draftTimer = null;
function stashDraft(){
  if(!editing || !editing.isNew) return;
  editing.dirty = true;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(function(){
    DATA.draft = editing.draft;
    save();
  }, 400);
}

function newDraft(kind){
  var now = new Date();
  return {
    id:uid(), at:now.toISOString(), kind:kind || "hard",
    stage:0, trigger:"", behaviors:[], tools:[], minutes:20,
    note:"", source:"Home", flagged:false,
    createdAt:now.toISOString(), updatedAt:null
  };
}

function editEntry(entry, resumeDraft){
  var isNew = !entry;
  var draft = entry ? JSON.parse(JSON.stringify(entry)) : (resumeDraft || newDraft("hard"));
  sheetMode = "entry";
  editing = { draft:draft, isNew:isNew, dirty:false };
  sheetTitle.textContent = isNew ? "What happened" : "Edit entry";
  sheetSave.textContent = isNew ? "Save entry" : "Save changes";
  autosaveNote.hidden = !isNew;
  clear(sheetBody);

  if(isNew && resumeDraft){
    var rb = el("div","banner good");
    rb.textContent = "Picked up where you left off.";
    sheetBody.appendChild(rb);
  }

  var d = new Date(draft.at);

  /* --- 1. STAGE: the primary question, first, no typing --- */
  var fStage = el("div","field");
  var lStage = el("label"); lStage.textContent = "How far did it get?";
  fStage.appendChild(lStage);
  var stagesWrap = el("div","stages");
  function paintStages(){
    clear(stagesWrap);
    STAGES.forEach(function(s){
      var b = el("button","stage s" + s.n); b.type = "button";
      b.setAttribute("aria-pressed", draft.stage === s.n ? "true" : "false");
      b.appendChild(el("span","num", String(s.n)));
      var body = el("span","body");
      body.appendChild(el("span","nm", s.name));
      body.appendChild(el("span","ds", s.ds));
      b.appendChild(body);
      b.addEventListener("click", function(){
        draft.stage = (draft.stage === s.n) ? 0 : s.n;
        paintStages(); stashDraft();
      });
      stagesWrap.appendChild(b);
    });
  }
  paintStages();
  fStage.appendChild(stagesWrap);
  sheetBody.appendChild(fStage);

  /* --- 2. TRIGGER --- */
  var fTrig = el("div","field");
  var lTrig = el("label"); lTrig.textContent = "What set it off ";
  lTrig.appendChild(el("span","hint","— pick one"));
  fTrig.appendChild(lTrig);
  fTrig.appendChild(chipGroup({
    items: DATA.settings.lib.triggers,
    selected: draft.trigger ? [draft.trigger] : [],
    multi:false, libKey:"triggers",
    onChange:function(sel){ draft.trigger = sel[0] || ""; stashDraft(); }
  }));
  sheetBody.appendChild(fTrig);

  /* --- 3. MINUTES --- */
  var fMin = el("div","field");
  fMin.appendChild(el("label", null, "Back to baseline in"));
  var sw = el("div","slider-wrap");
  var sv = el("div","slider-val");
  var svNum = document.createTextNode(String(draft.minutes));
  sv.appendChild(svNum); sv.appendChild(el("span", null, "minutes"));
  var prev = el("div","slider-preview");
  var pf = el("span","rfill");
  prev.appendChild(pf);
  var rng = el("input"); rng.type = "range"; rng.min = "5"; rng.max = "180"; rng.step = "5";
  rng.value = String(draft.minutes); rng.setAttribute("aria-label","Minutes until back to baseline");
  function paintMins(){
    var v = parseInt(rng.value,10);
    draft.minutes = v;
    svNum.nodeValue = String(v);
    pf.style.width = minsWidth(v) + "%";
    pf.style.background = minsColor(v);
  }
  rng.addEventListener("input", function(){ paintMins(); stashDraft(); });
  sw.appendChild(sv); sw.appendChild(prev); sw.appendChild(rng);
  var quick = el("div","quickmins");
  [5,15,30,60,90,120].forEach(function(v){
    var b = el("button", null, fmtMins(v)); b.type = "button";
    b.addEventListener("click", function(){ rng.value = String(v); paintMins(); stashDraft(); });
    quick.appendChild(b);
  });
  sw.appendChild(quick);
  fMin.appendChild(sw);
  paintMins();
  sheetBody.appendChild(fMin);

  /* --- 4. WHAT HELPED --- */
  var fTool = el("div","field");
  var lTool = el("label"); lTool.textContent = "What helped ";
  lTool.appendChild(el("span","hint","— pick any"));
  fTool.appendChild(lTool);
  fTool.appendChild(chipGroup({
    items: DATA.settings.lib.tools,
    selected: draft.tools,
    multi:true, libKey:"tools",
    onChange:function(sel){ draft.tools = sel; stashDraft(); }
  }));
  sheetBody.appendChild(fTool);

  /* --- everything below is optional, hidden by default --- */
  var moreBox = el("div");
  var hasExtra = !!(draft.note || (draft.behaviors||[]).length || draft.flagged ||
                    (draft.source && draft.source !== "Home"));
  moreBox.hidden = !hasExtra && isNew;

  var moreBtn = el("button","more-toggle", moreBox.hidden ? "+ Add more detail" : "− Less detail");
  moreBtn.type = "button";
  moreBtn.addEventListener("click", function(){
    moreBox.hidden = !moreBox.hidden;
    moreBtn.textContent = moreBox.hidden ? "+ Add more detail" : "− Less detail";
  });
  sheetBody.appendChild(moreBtn);

  // when
  var fWhen = el("div","field");
  var lWhen = el("label"); lWhen.textContent = "When it happened ";
  lWhen.appendChild(el("span","hint","— change this if you're logging it later"));
  fWhen.appendChild(lWhen);
  var row = el("div","row2");
  var dIn = el("input"); dIn.type = "date"; dIn.value = toDateInput(d); dIn.setAttribute("aria-label","Date");
  var tIn = el("input"); tIn.type = "time"; tIn.value = toTimeInput(d); tIn.setAttribute("aria-label","Time");
  function syncWhen(){
    var nd = fromInputs(dIn.value, tIn.value);
    if(nd){ draft.at = nd.toISOString(); stashDraft(); }
  }

sheetSave.addEventListener("click", function(){
  if(sheetMode === "note"){ closeSheet(); return; }
  if(sheetMode === "change"){ saveChange(); return; }
  if(!editing) return;
  var d = editing.draft;
  var wasNew = editing.isNew;
  // a good day has no stage — only episodes need one
  if(d.kind !== "good" && !d.stage){
    toast("Pick how far it got"); sheetBody.scrollTop = 0; return;
  }
  if(wasNew){
    DATA.entries.push(d);
    DATA.draft = null;
  } else {
    d.updatedAt = new Date().toISOString();
    DATA.entries = DATA.entries.map(function(e){ return e.id === d.id ? d : e; });
  }
  save(); closeSheet(); render();
  toast(wasNew ? "Saved" : "Updated");

  // The one moment they actually know how the day went. One tap, skippable.
  if(wasNew && d.kind !== "good"){
    var k = toDateInput(new Date(d.at));
    var alreadyGood = DATA.entries.some(function(x){
      return x.kind === "good" && toDateInput(new Date(x.at)) === k;
    });
    if(!alreadyGood){
      setTimeout(function(){
        askConfirm("How was the rest of the day?",
          "Fine, actually", function(){ logGoodDay(new Date(d.at)); },
          "Rough too", "good");
      }, 450);
    }
  }
});

/* ---- one-tap good day ---- */
function logGoodDay(forDate){
  var now = forDate ? new Date(forDate) : new Date();
  var todayKey = toDateInput(now);
  var already = DATA.entries.some(function(e){
    return e.kind === "good" && toDateInput(new Date(e.at)) === todayKey;
  });
  if(already){ toast("Today is already marked good"); return; }
  var hadEpisode = DATA.entries.some(function(e){
    return e.kind !== "good" && toDateInput(new Date(e.at)) === todayKey;
  });
  var e = {
    id:uid(), at:now.toISOString(), kind:"good", note:"", source:"Home",
    createdAt:now.toISOString(), updatedAt:null
  };
  DATA.entries.push(e);
  save(); render();
  toast(hadEpisode ? "Marked good overall" : "Good day logged", "Undo", function(){
    DATA.entries = DATA.entries.filter(function(x){ return x.id !== e.id; });
    save(); render();
  });
}

/* ============================================================
   ANALYSIS
   ============================================================ */
function analyse(list){
  var all = list || DATA.entries;
  var es = hardOnly(all);
  var good = all.filter(function(e){ return e.kind === "good"; });
  var trig = {}, tools = {}, beh = {}, src = {}, stages = {};
  es.forEach(function(e){
    if(e.trigger) trig[e.trigger] = (trig[e.trigger] || 0) + 1;
    src[e.source || "Home"] = (src[e.source || "Home"] || 0) + 1;
    stages[e.stage || 4] = (stages[e.stage || 4] || 0) + 1;
    (e.behaviors||[]).forEach(function(b){ beh[b] = (beh[b]||0)+1; });
    (e.tools||[]).forEach(function(t){
      if(/^nothing/i.test(t)) return;
      (tools[t] = tools[t] || []).push(e.minutes);
    });
  });
  function rank(o){
    return Object.keys(o).map(function(k){ return {name:k, n:o[k]}; })
      .sort(function(a,b){ return b.n - a.n; });
  }
  var helps = Object.keys(tools).map(function(k){
    return {name:k, n:tools[k].length, med:median(tools[k])};
  }).sort(function(a,b){
    if(a.n >= 2 && b.n < 2) return -1;
    if(b.n >= 2 && a.n < 2) return 1;
    return a.med - b.med;
  });
  var nothing = es.filter(function(e){
    return (e.tools||[]).some(function(t){ return /^nothing/i.test(t); });
  }).length;
  var caughtEarly = es.filter(function(e){ return e.stage === 1; }).length;

  // days are days. An episode is an event; several can share one day,
  // and a day can be marked good even if something happened in it.
  function dayKey(e){ return toDateInput(new Date(e.at)); }
  var hardDaySet = {}, goodDaySet = {}, allDaySet = {};
  es.forEach(function(e){ hardDaySet[dayKey(e)] = 1; allDaySet[dayKey(e)] = 1; });
  good.forEach(function(e){ goodDaySet[dayKey(e)] = 1; allDaySet[dayKey(e)] = 1; });
  var hardDays = Object.keys(hardDaySet).length;
  var goodDays = Object.keys(goodDaySet).length;
  var allDays  = Object.keys(allDaySet).length;
  var bothDays = Object.keys(goodDaySet).filter(function(k){ return hardDaySet[k]; }).length;
  var clearDays = allDays - hardDays;
  var perWeek = 0, spanDays = 0;
  if(all.length){
    var times = all.map(function(e){ return new Date(e.at).getTime(); });
    spanDays = Math.max(1, (Math.max.apply(null,times) - Math.min.apply(null,times)) / 86400000);
    perWeek = es.length / (spanDays / 7);   // episodes per week, not days
  }
  return {
    n: es.length, nGood: good.length, nAll: all.length,
    episodes: es.length,
    hardDays: hardDays, goodDays: goodDays, allDays: allDays,
    bothDays: bothDays, clearDays: clearDays,
    topTriggers: rank(trig), topBeh: rank(beh), sources: rank(src),
    stages: stages, caughtEarly: caughtEarly,
    helps: helps, nothing: nothing,
    longest: es.slice().sort(function(a,b){ return b.minutes - a.minutes; }).slice(0,5),
    flagged: es.filter(function(e){ return e.flagged; }),
    typical: median(es.map(function(e){ return e.minutes; })),
    perWeek: perWeek, spanDays: Math.round(spanDays)
  };
}
function entriesBetween(a,b){
  return DATA.entries.filter(function(e){
    var t = new Date(e.at).getTime();
    return t >= a && t < b;
  });
}
function pctChange(a,b){ if(!a) return null; return Math.round(((b-a)/a)*100); }

var CHANGE_KINDS = [
  {k:"med",     label:"Medication", hint:"a drug, a dose, or stopping one"},
  {k:"therapy", label:"Therapy",    hint:"ABA, OT, speech, counselling"},
  {k:"school",  label:"School",     hint:"new class, teacher, term, routine"},
  {k:"other",   label:"Something else", hint:"a strategy, a move, anything"}
];
function kindLabel(k){
  for(var i=0;i<CHANGE_KINDS.length;i++) if(CHANGE_KINDS[i].k === k) return CHANGE_KINDS[i].label;
  return "Change";
}
function sortedChanges(){
  return DATA.changes.slice().sort(function(a,b){ return new Date(b.start) - new Date(a.start); });
}
function currentMeds(){
  return DATA.changes.filter(function(c){ return c.kind === "med" && !c.end; })
    .sort(function(a,b){ return new Date(a.start) - new Date(b.start); });
}
function pastMeds(){
  return DATA.changes.filter(function(c){ return c.kind === "med" && c.end; })
    .sort(function(a,b){ return new Date(b.start) - new Date(a.start); });
}
function medLine(c){ return c.label + (c.dose ? " · " + c.dose : ""); }
function daysSince(iso){ return Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 86400000)); }

// Windowed comparison. Independent of any other change, so overlapping
// medications no longer truncate each other.
function compareChange(c, windowDays){
  var w = (windowDays || 30) * 86400000;
  var at = new Date(c.start).getTime();
  var afterEnd = Math.min(at + w, Date.now() + 1);
  return {
    before: analyse(entriesBetween(at - w, at)),
    after:  analyse(entriesBetween(at, afterEnd)),
    beforeFrom: at - w, beforeTo: at,
    afterFrom: at, afterTo: afterEnd,
    afterDays: Math.round((afterEnd - at) / 86400000),
    windowDays: windowDays || 30
  };
}

   VIEWS

var current = "log";
var pageMode = "handoff";
var expandedMonths = {};
var view = document.getElementById("view");
var dock = document.getElementById("dock");
var topTitle = document.getElementById("topTitle");
var topSub = document.getElementById("topSub");

function render(){
  clear(view);

  topAction.onclick = null;
  buildDock();
  refreshPip();
  if(current === "log") renderLog();
  else if(current === "read") renderRead();

  else renderSettings();

    t.setAttribute("aria-current", t.dataset.tab === current ? "true" : "false");

}

function renderLog(){
  var es = sortedEntries();
  topTitle.textContent = childName() === "Your child" ? "Log" : childName();
  var a = analyse();
  topSub.textContent = es.length
    ? a.episodes + (a.episodes === 1 ? " episode" : " episodes") + " · " + a.allDays + " days"
    : "Nothing logged yet";

  if(!persistent){
    var b = el("div","banner warn");
    b.textContent = "Saving isn't available here, so entries will disappear when you close this. Everything else works — use Export in Setup to keep a copy.";
    view.appendChild(b);
  }

  if(DATA.draft){
    var rb = el("div","banner info");
    rb.appendChild(el("span", null, "You have an unfinished entry."));
    var resume = el("button", null, "Pick it back up"); resume.type = "button";
    resume.addEventListener("click", function(){ editEntry(null, DATA.draft); });
    rb.appendChild(resume);
    var discard = el("button", null, "Discard"); discard.type = "button";
    discard.style.marginLeft = "12px";
    discard.addEventListener("click", function(){ DATA.draft = null; save(); render(); });
    rb.appendChild(discard);
    view.appendChild(rb);
  }

  if(!es.length){
    var emp = el("div","empty");
    emp.appendChild(mark("kcTile"));
    emp.appendChild(el("h2", null, "Nothing logged yet"));
    emp.appendChild(el("p", null, "Log the good days too. A record made only of meltdowns makes any child look worse than they are."));
    var how = el("div","banner good");
    how.style.textAlign = "left";
    how.textContent = "Two different things: an episode is one moment, a good day is your verdict on the whole day. You can log both for the same day — a rough half hour doesn't cancel out a decent day, and Kasey counts them separately.";
    emp.appendChild(how);
    var seed = el("button","btn-quiet","Load a few example entries"); seed.type = "button";
    seed.addEventListener("click", seedExamples);
    emp.appendChild(seed);
    view.appendChild(emp);
    return;
  }

  // summary strip
  var last30 = entriesBetween(Date.now() - 30*86400000, Date.now() + 1);
  var a30 = analyse(last30);
  var strip = el("button","strip"); strip.type = "button";
  strip.appendChild(el("span","lab","Last 30 days"));
  var srow = el("div","strip-row");
  function stat(num, unit, label){
    var s = el("div","strip-stat");
    var n = el("span","n", num);
    if(unit) n.appendChild(el("small", null, unit));
    s.appendChild(n);
    s.appendChild(el("span","t", label));
    return s;
  }
  srow.appendChild(stat(String(a30.hardDays), a30.allDays ? " of " + a30.allDays : "", "days had an episode"));
  srow.appendChild(stat(a30.typical ? String(a30.typical) : "—", a30.typical ? "min" : "", "typical recovery"));
  srow.appendChild(stat(String(a30.caughtEarly), "", "caught early"));
  strip.appendChild(srow);
  if(a30.allDays){
    var ratio = el("div","ratio");
    var gpct = Math.round(a30.clearDays / a30.allDays * 100);
    var g = el("span"); g.style.cssText = "width:" + gpct + "%;background:var(--good)";
    var hb = el("span"); hb.style.cssText = "width:" + (100-gpct) + "%;background:var(--s3)";
    ratio.appendChild(g); ratio.appendChild(hb);
    strip.appendChild(ratio);
    var rlab = el("div","ratio-lab");
    rlab.appendChild(el("span", null, a30.clearDays + " clear"));
    rlab.appendChild(el("span", null, a30.hardDays + " with an episode"));
    strip.appendChild(rlab);
  }
  var go = el("div","go");
  go.appendChild(el("span", null, "Open the pages you can share"));
  go.appendChild(el("span", null, "→"));
  strip.appendChild(go);
  strip.addEventListener("click", function(){ current = "page"; window.scrollTo(0,0); render(); });
  view.appendChild(strip);

  var weekAgo = Date.now() - 7*86400000;
  var recent = es.filter(function(e){ return new Date(e.at).getTime() >= weekAgo; });
  var older  = es.filter(function(e){ return new Date(e.at).getTime() <  weekAgo; });

  if(recent.length){
    view.appendChild(el("div","daylabel","This week"));
    renderDayStacks(view, recent);
  }

  if(older.length){
    var groups = {}, order = [];
    older.forEach(function(e){
      var d = new Date(e.at);
      var key = d.getFullYear() + "-" + pad(d.getMonth()+1);
      if(!groups[key]){ groups[key] = {label: MONS[d.getMonth()] + " " + d.getFullYear(), items:[]}; order.push(key); }
      groups[key].items.push(e);
    });
    var sep = el("div","daylabel","Earlier");
    sep.style.marginTop = "26px";
    view.appendChild(sep);
    order.forEach(function(key){
      var g = groups[key];
      var open = !!expandedMonths[key];
      var head = el("button","mhead"); head.type = "button";
      head.setAttribute("aria-expanded", open ? "true" : "false");
      head.appendChild(el("span","caret","▶"));
      head.appendChild(el("span","name", g.label));
      var ga = analyse(g.items);
      head.appendChild(el("span","cnt", ga.episodes + " ep · " + ga.allDays + " days"));
      view.appendChild(head);
      var box = el("div","mgroup");
      box.hidden = !open;
      renderDayStacks(box, g.items);
      view.appendChild(box);
      head.addEventListener("click", function(){
        expandedMonths[key] = !expandedMonths[key];
        head.setAttribute("aria-expanded", expandedMonths[key] ? "true" : "false");
        box.hidden = !expandedMonths[key];
      });
    });
  }
}

// One block per calendar day: the verdict on top, the day's episodes beneath it.
function renderDayStacks(host, list){
  var days = {}, order = [];
  list.forEach(function(e){
    var k = toDateInput(new Date(e.at));
    if(!days[k]){ days[k] = {good:null, hard:[]}; order.push(k); }
    if(e.kind === "good") days[k].good = e; else days[k].hard.push(e);
  });
  order.forEach(function(k){
    var g = days[k];
    var anchor = g.good || g.hard[0];
    var d = new Date(anchor.at);
    var dl = el("div","daylabel", fmtDayHeading(d));
    dl.style.marginTop = "14px";
    host.appendChild(dl);

    var stack = el("div","day-stack" + (g.good ? "" : " no-verdict"));
    if(g.good){
      stack.appendChild(verdictRow(g.good, g.hard.length));
      if(!g.hard.length){
        stack.appendChild(el("p","verdict-note","Nothing happened worth logging."));
      }
    }
    g.hard.sort(function(a,b){ return new Date(b.at) - new Date(a.at); })
          .forEach(function(e){ stack.appendChild(entryCard(e, new Date(e.at))); });
    host.appendChild(stack);
  });
}

function verdictRow(e, hardCount){
  var row = el("button","goodrow" + (hardCount ? " has-below" : "")); row.type = "button";
  row.appendChild(el("span","dot"));
  var txt = el("span","txt", hardCount
    ? "Something happened, but overall a good day"
    : "Good day");
  if(e.note){
    txt.appendChild(document.createTextNode(" "));
    txt.appendChild(el("span","note", e.note));
  }
  row.appendChild(txt);
  row.addEventListener("click", function(){ viewEntry(e); });
  return row;
}

function entryCard(e, d){
  var card = el("button","entry"); card.type = "button";
  var top = el("div","entry-top");
  top.appendChild(el("span","entry-trigger", e.trigger || "Something happened"));
  top.appendChild(el("span","entry-time", fmtTime(d)));
  card.appendChild(top);

  var st = STAGES[(e.stage||4) - 1];
  var what = el("div","entry-what");
  what.textContent = st ? st.name : "";
  if((e.behaviors||[]).length) what.textContent += " · " + e.behaviors.join(", ");
  card.appendChild(what);

  var rec = el("div","recovery");
  var bar = el("span","rbar");
  var fill = el("span","rfill");
  fill.style.width = minsWidth(e.minutes) + "%";
  fill.style.background = minsColor(e.minutes);
  bar.appendChild(fill);
  rec.appendChild(bar);
  rec.appendChild(el("span","rmin", fmtMins(e.minutes)));
  card.appendChild(rec);

  var tools = e.tools || [];
  var none = tools.some(function(t){ return /^nothing/i.test(t); });
  var foot = el("div","rtool" + (none ? " none" : ""));
  if(tools.length){
    foot.appendChild(el("span","dot"));
    foot.appendChild(el("span", null, tools.join(" + ")));
  }
  var tags = el("span");
  tags.style.cssText = "margin-left:auto;display:flex;gap:5px;flex:none";
  if(e.flagged) tags.appendChild(el("span","src-tag","⚑"));
  if(e.source && e.source !== "Home") tags.appendChild(el("span","src-tag", e.source));
  if(tags.childNodes.length) foot.appendChild(tags);
  if(tools.length || tags.childNodes.length) card.appendChild(foot);

  if(e.note) card.appendChild(el("div","entry-note", e.note));

  card.addEventListener("click", function(){ viewEntry(e); });
  return card;
}

    if(all.n > 2){

      rec.appendChild(el("div","cmp2", word + " the usual " + fmtMins(all.typical) + "."));

    if((e.behaviors||[]).length){

    var s4 = el("div","d-sec");

  eyebrow:"Using AI well",
